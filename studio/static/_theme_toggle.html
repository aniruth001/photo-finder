<button class="themebtn" id="themebtn" type="button">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
</button>
<script>
  (function () {  // the visitor can switch; it is remembered on this device for every gallery
    var b = document.getElementById("themebtn"), d = document.documentElement;
    function label() {
      var to = d.getAttribute("data-theme") === "light" ? "dark" : "light";
      b.setAttribute("aria-label", "Switch to " + to + " mode"); b.title = "Switch to " + to + " mode";
    }
    b.onclick = function () {
      var t = d.getAttribute("data-theme") === "light" ? "dark" : "light";
      d.setAttribute("data-theme", t); label();
      try { localStorage.setItem("pf_theme", t); } catch (e) {}
    };
    label();
  })();
</script>
