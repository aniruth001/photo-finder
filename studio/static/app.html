<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Photo Finder Studio</title>
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --line: #e6e2d8; --ink: #1d1b16; --muted: #6f6a5d; --soft: #efece4;
    --brand: #f0c52f; --brand-ink: #1b1406; --danger: #b4321f; --ok: #1f7a45; --warn: #96600a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  h1 { font-size: 1.7rem; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  [hidden] { display: none !important; }

  /* header */
  header.top { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .bar { max-width: 1080px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; }
  .logo i { width: 30px; height: 30px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); display: grid;
            place-items: center; font-style: normal; font-weight: 800; }
  nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; min-width: 0; }
  @media (max-width: 760px) { nav { order: 3; flex-basis: 100%; } .who { margin-left: auto; } }  /* phones: the links get a row of their own */
  nav a { text-decoration: none; padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; }
  nav a.on, nav a:hover { background: var(--soft); color: var(--ink); }
  .who { display: flex; align-items: center; gap: 10px; }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .crumbs { margin-bottom: 6px; font-size: .85rem; }
  .crumbs a { color: var(--muted); text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }

  /* controls */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border-radius: 9px; border: 1px solid var(--line);
         background: var(--card); color: var(--ink); font-weight: 600; font-size: .92rem; font-family: inherit; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.primary:hover { filter: brightness(.96); }
  .btn.danger { color: var(--danger); border-color: #e4c3bc; }
  .btn.danger:hover { background: #fbeeeb; }
  .btn.sm { padding: 5px 10px; font-size: .82rem; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  input, select, textarea { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: var(--brand); }
  input[type=checkbox] { width: auto; }
  input[type=color] { padding: 2px; height: 40px; width: 60px; }
  label.f { display: block; margin-bottom: 12px; font-weight: 600; font-size: .85rem; }
  label.f > span { display: block; margin-bottom: 4px; }
  label.f small { font-weight: 400; color: var(--muted); }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: .9rem; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .two, .three { grid-template-columns: 1fr; } }
  .est-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
  .est-side { position: sticky; top: 84px; }
  @media (max-width: 960px) { .est-grid { grid-template-columns: 1fr; } .est-side { position: static; } }
  .pkg { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--soft); }
  .pkg-head { display: grid; grid-template-columns: 22px minmax(0, 1fr) 150px auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  @media (max-width: 640px) { .pkg-head { grid-template-columns: 22px minmax(0, 1fr) auto; } .pkg-head [data-k="amount"] { grid-column: 2 / 4; grid-row: 2; } }
  .pkg-move { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  .est-line { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: .92rem; }
  .est-line span { color: var(--muted); }
  .est-line.grand { border-top: 2px solid var(--brand); margin-top: 6px; padding-top: 12px; font-size: 1.05rem; }
  .est-line.grand span { color: var(--ink); font-weight: 700; }
  .est-acts { display: grid; gap: 8px; margin-top: 16px; }
  .est-acts .btn { justify-content: center; }
  .kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 640px) { .kinds { grid-template-columns: 1fr; } }
  .kind { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .kind input { width: auto; margin-top: 3px; accent-color: var(--brand); }
  .kind > span { display: grid; gap: 2px; }
  .kind:has(input:checked) { border-color: var(--brand); background: var(--soft); }
  .kind:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* cards, lists */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  a.item, div.item { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-decoration: none; }
  a.item:hover { border-color: #cfc9b8; box-shadow: 0 2px 10px rgba(40,30,0,.06); }
  .item b { display: block; margin-bottom: 2px; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); }
  td { padding: 12px; border-bottom: 1px solid var(--soft); vertical-align: middle; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #faf9f5; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: .75rem; font-weight: 700; background: var(--soft); color: var(--muted); }
  .badge.pub { background: #dff3e6; color: var(--ok); } .badge.busy { background: #fbefd0; color: var(--warn); }
  .badge.bad { background: #fbe4df; color: var(--danger); }
  .empty { text-align: center; padding: 44px 16px; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }
  .meter { height: 8px; background: var(--soft); border-radius: 9px; overflow: hidden; margin: 6px 0 4px; }
  .meter > div { height: 100%; background: var(--brand); border-radius: 9px; }
  .meter.hot > div { background: var(--danger); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }

  /* auth */
  .auth { max-width: 420px; margin: 7vh auto 0; padding: 0 16px; }
  .auth h1 { text-align: center; margin-bottom: 6px; } .auth .sub { text-align: center; margin: 0 0 22px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 10px; padding: 4px; margin-bottom: 18px; }
  .tabs button { border: 0; background: none; padding: 8px; border-radius: 7px; font-weight: 600; font-size: .9rem; font-family: inherit; cursor: pointer; color: var(--muted); }
  .tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .gbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 10px 14px; border: 1px solid #dadce0;
          border-radius: 9px; background: #fff; color: #1f1f1f; font-weight: 600; font-size: .92rem; font-family: inherit; text-decoration: none; }
  .gbtn:hover { background: #f8f9fa; } .gbtn svg { width: 18px; height: 18px; flex: none; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .8rem; margin: 16px 0; }
  .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .msg { padding: 10px 12px; border-radius: 9px; margin-bottom: 14px; font-size: .9rem; }
  .msg.err { background: #fbe4df; color: var(--danger); } .msg.ok { background: #dff3e6; color: var(--ok); }

  /* event page */
  .share { display: grid; grid-template-columns: 1fr 132px; gap: 20px; align-items: center; }
  .share img { width: 132px; height: 132px; border-radius: 10px; border: 1px solid var(--line); image-rendering: pixelated; }
  @media (max-width: 640px) { .share { grid-template-columns: 1fr; } .share img { justify-self: center; } }
  .drop { border: 2px dashed #d6d0be; border-radius: 14px; padding: 30px 16px; text-align: center; background: #fcfbf8; transition: .15s; }
  .drop.over { border-color: var(--brand); background: #fff9de; }
  .drop b { display: block; font-size: 1.02rem; margin-bottom: 4px; }
  .prog { margin-top: 14px; }
  .prog .meter { height: 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .subnav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: -8px 0 20px; }
  .subnav a { padding: 9px 14px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .subnav a.on { color: var(--ink); border-bottom-color: var(--brand); }
  .subnav a:hover { color: var(--ink); }
  .inv-tile .inv-v { font-size: 1.4rem; font-weight: 700; }
  .inv-tile.hot { border-color: #e9b8ad; }
  table.inv td { vertical-align: top; }
  .cal-bar { justify-content: space-between; }
  .cal-title { margin: 0 6px; min-width: 170px; text-align: center; }
  .cal-card { padding: 0; overflow: hidden; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-wd { padding: 8px 10px; font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); }
  .cal-day { min-height: 112px; padding: 6px; border-right: 1px solid var(--soft); border-bottom: 1px solid var(--soft); display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; }
  .cal-day:nth-child(7n) { border-right: 0; }
  .cal-day:hover { background: #fcfbf7; }
  .cal-day.other { background: #faf9f6; } .cal-day.other .cal-num { color: #b9b3a5; }
  .cal-num { font-size: .82rem; font-weight: 700; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
  .cal-day.today .cal-num { background: var(--ink); color: #fff; }
  .cal-chip { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid; border-radius: 5px; padding: 3px 6px; font-size: .76rem; font-family: inherit;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; text-decoration: none; color: var(--ink); }
  .cal-chip.own { background: #e6f0ff; border-color: #2f6fd6; }
  .cal-chip.expost { background: #f1e9ff; border-color: #7a4fd6; }
  .cal-chip.ev { background: var(--soft); border-color: #a39c8c; }
  .cal-more { border: 0; background: none; color: var(--muted); font-size: .74rem; text-align: left; padding: 0 4px; cursor: pointer; font-family: inherit; }
  .cal-dots { display: none; gap: 3px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .dot.own { background: #2f6fd6; } .dot.expost { background: #7a4fd6; } .dot.ev { background: #a39c8c; }
  .src { font-size: .8rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
  .src.own { background: #e6f0ff; color: #1f55ad; } .src.expost { background: #f1e9ff; color: #5b34b0; }
  .cal-daylist { display: grid; gap: 6px; }
  .cal-daylist .cal-chip { font-size: .9rem; padding: 8px 10px; white-space: normal; }
  .bk-pay { background: var(--soft); border-radius: 12px; padding: 12px 12px 2px; margin-bottom: 8px; }
  .bk-bal { padding: 9px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  table.cal-list td { vertical-align: top; }
  .cal-nav { font-size: 1.15rem; line-height: 1; padding: 6px 12px; }
  .cal-src-m { display: none; margin-top: 4px; }
  @media (max-width: 640px) {   /* phones: dots in the grid, the list below does the talking */
    .cal-day { min-height: 54px; padding: 4px; } .cal-day .cal-chip, .cal-more { display: none; } .cal-dots { display: flex; }
    .cal-wd { padding: 6px 2px; text-align: center; font-size: .66rem; } .cal-num { margin: 0 auto; }
    .cal-title { min-width: 0; font-size: 1.05rem; }
    .cal-src { display: none; } .cal-src-m { display: block; } table.cal-list td, table.cal-list th { padding: 10px 8px; }
  }
  .inv-search { width: 240px; }
  .inv-cat-m { display: none; }
  @media (max-width: 640px) {   /* phones: category under the name, actions under the status */
    .inv-cat { display: none; } .inv-cat-m { display: block; } .inv-search { width: 100%; }
    table.inv td, table.inv th { padding: 10px 8px; }
  }
  .inv-hist { display: grid; gap: 10px; max-height: 280px; overflow: auto; border-left: 2px solid var(--line); padding-left: 12px; font-size: .9rem; }
  .chip { padding: 4px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: .8rem; font-family: inherit; cursor: pointer; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip.on .muted { color: inherit; opacity: .75; }
  .fold-head { justify-content: space-between; margin-bottom: 4px; }
  .fold-count { font-weight: 400; margin-left: 4px; }
  .fold.min .fold-body, .fold.min .fold-tools { display: none; }
  .fold.min .fold-head { margin-bottom: 0; }
  .fold:not(.min) .fold-count { display: none; }
  .drop.slim { padding: 18px 16px; }
  .vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
  .vd { position: relative; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: var(--card); cursor: pointer; }
  .vd-frame { position: relative; aspect-ratio: 16 / 9; background: #111; }
  .vd-frame video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .vd-play { position: absolute; inset: 0; margin: auto; width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,.55);
             color: #fff; display: grid; place-items: center; font-size: 1.05rem; padding-left: 3px; }
  .vd:hover .vd-play { background: var(--brand); color: var(--brand-ink); }
  .vd-meta { display: grid; gap: 2px; padding: 8px 10px; }
  .vd-meta b { font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vd input[type=checkbox] { position: absolute; top: 8px; left: 8px; width: 20px; height: 20px; accent-color: var(--brand); }
  video.player { display: block; width: 100%; max-height: 78vh; background: #000; border-radius: 10px; }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; margin-top: 14px; }
  .ph { position: relative; aspect-ratio: 1; border-radius: 9px; overflow: hidden; background: var(--soft); cursor: pointer; }
  .ph img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; }
  .ph input { position: absolute; top: 6px; left: 6px; width: 20px; height: 20px; accent-color: var(--brand); }
  .vn-list { display: grid; gap: 10px; margin-top: 12px; }
  .vn { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
  .vn.off { background: var(--soft); }
  .vn-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .vn-add { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.2fr) auto; gap: 8px; margin-top: 10px; }
  @media (max-width: 640px) { .vn-add { grid-template-columns: 1fr; } }
  .alb-note { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .alb-badge { display: inline-block; font-size: .74rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; margin-left: 6px; vertical-align: 2px; }
  .alb-badge.new { background: #ffe4ea; color: #a3153a; } .alb-badge.lock { background: var(--soft); color: var(--muted); }
  .ph .pnm { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 4px; font-size: .7rem; color: #fff;
             background: linear-gradient(transparent, rgba(0,0,0,.65)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ph .st { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 8px; font-size: .78rem; font-weight: 600; color: var(--muted); }
  .ph.bad .st { color: var(--danger); background: #fbeeeb; }
  details.card > summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; list-style: none; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after { content: "▾"; float: right; color: var(--muted); }
  details[open].card > summary { margin-bottom: 14px; }

  /* tasks board */
  main.wide, body:has(main.wide) .bar { max-width: 1440px; }
  .kb { display: flex; gap: 14px; overflow-x: auto; align-items: flex-start; padding-bottom: 12px; scroll-snap-type: x proximity; }
  .kb-col { flex: 0 0 290px; display: flex; flex-direction: column; min-width: 0; scroll-snap-align: start; }
  .kb-head { display: flex; align-items: center; gap: 4px; padding: 0 2px; }
  .kb-head h3 { margin: 0; font-size: 1.05rem; flex: 1; }
  .kb-add { border: 0; background: none; font: inherit; font-size: 1.3rem; line-height: 1; padding: 2px 8px; border-radius: 6px; cursor: pointer; color: var(--muted); }
  .kb-add:hover { background: var(--soft); color: var(--ink); }
  .kb-bar { display: flex; height: 7px; border-radius: 9px; overflow: hidden; background: var(--soft); }
  .kb-bar i { display: block; height: 100%; }
  .kb-n { font-weight: 700; font-size: .85rem; color: var(--muted); min-width: 14px; text-align: right; }
  .kb-body { display: grid; gap: 8px; min-height: 90px; padding: 8px 2px 4px; border-radius: 12px; align-content: start; transition: background .1s; }
  .kb-body.over, .kb-col.fold.over { background: var(--soft); }
  .kb-none { text-align: center; padding: 18px 8px; border: 1px dashed var(--line); border-radius: 10px; }
  .kb-col.fold { flex: 0 0 46px; align-items: center; gap: 10px; padding: 8px 0; border-radius: 12px; cursor: pointer; min-height: 200px; }
  .kb-col.fold:hover { background: var(--soft); }
  .kb-fold-l { writing-mode: vertical-rl; font-weight: 700; color: var(--muted); font-size: 1.02rem; }
  .kb-card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--st); border-radius: 10px; padding: 10px 12px; cursor: pointer;
             display: grid; gap: 6px; min-width: 0; }
  .kb-card:hover { box-shadow: 0 2px 10px rgba(40,30,0,.08); }
  .kb-card.dragging { opacity: .4; }
  .kb-card[draggable] { cursor: grab; }
  .kb-title { font-weight: 700; overflow-wrap: anywhere; }
  .kb-sub { overflow-wrap: anywhere; margin-top: -4px; }
  .kb-ph { height: 60px; border: 2px dashed #cfc9b8; border-radius: 10px; }
  .kb-due { font-weight: 600; } .kb-due.soon { color: var(--warn); } .kb-due.late { color: var(--danger); }
  .kb-foot { display: flex; align-items: center; gap: 8px; }
  .kb-star { border: 0; background: none; padding: 0 2px; font-size: 1.2rem; line-height: 1; cursor: pointer; color: #b9b3a5; }
  .kb-star.on { color: #e9a400; } .kb-star:disabled { cursor: default; }
  .kb-meta { display: inline-flex; align-items: center; gap: 3px; font-size: .8rem; color: var(--muted); font-weight: 600; }
  .kb-meta.full { color: var(--ok); }
  .kb-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; flex: none; }
  .kb-dot:disabled { cursor: default; }
  .avs { display: inline-flex; }
  .av { width: 24px; height: 24px; border-radius: 6px; color: #fff; display: inline-grid; place-items: center; font-size: .75rem; font-weight: 700; margin-left: 3px; flex: none; }
  .av.more { background: var(--soft); color: var(--muted); }
  .tg { font-size: .75rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .tg.vendor { background: var(--card); color: #5b34b0; box-shadow: inset 0 0 0 1px #c9b6f2; }
  .kb-menu { position: absolute; z-index: 15; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px; display: grid; width: 190px; }
  .kb-menu button { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 7px; font: inherit; font-size: .9rem; cursor: pointer; }
  .kb-menu button:hover, .kb-menu button.on { background: var(--soft); }
  .kb-quick { background: var(--card); border: 1px solid var(--brand); border-radius: 10px; padding: 8px; }
  .tk-h { margin: 16px 0 8px; font-size: .95rem; }
  .tk-vendor { background: #f6f1ff; border: 1px solid #e3d8fa; border-radius: 12px; padding: 12px 14px 4px; margin: 4px 0 12px; }
  .tk-vendor.box { padding-bottom: 12px; }
  .tk-check { display: grid; gap: 6px; }
  .tk-f { margin-bottom: 12px; } .tk-lbl { display: block; margin-bottom: 4px; font-weight: 600; font-size: .85rem; }
  .tk-person { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .tk-person:has(input:checked) { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tk-cl { display: grid; gap: 6px; margin-bottom: 8px; }
  .tk-cl-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .tk-cl-row input[type=text] { padding: 6px 9px; }
  @media (max-width: 640px) { .kb-col { flex-basis: 84vw; } .tk-stats { grid-template-columns: 1fr 1fr; gap: 10px; } .tk-stats .card { padding: 12px 14px; } }

  /* overlays */
  #modal-root .ov { position: fixed; inset: 0; background: rgba(20,16,0,.5); display: grid; place-items: center; z-index: 20; padding: 16px; }
  #modal-root .dlg { background: var(--card); border-radius: 16px; padding: 24px; width: 100%; max-width: 460px; max-height: 92vh; overflow: auto; }
  #modal-root .dlg.wide { max-width: 980px; padding: 12px; background: #000; }
  #modal-root .dlg.edit { max-width: 700px; }
  .hdrlogo { height: 32px; max-width: 200px; object-fit: contain; display: block; }
  .logoprevs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 640px) { .logoprevs { grid-template-columns: 1fr; } }
  .lp { border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line); min-height: 96px; display: grid; gap: 8px; align-content: start; }
  .lp > div, .lp > canvas { min-height: 48px; display: flex; align-items: center; }
  .lp.light { background: #fff; } .lp.dark { background: #14100e; color: #ab9d94; border-color: #14100e; justify-items: center; text-align: center; }
  .lp.dark > div { justify-content: center; }
  .ed-tabs { display: flex; gap: 4px; background: var(--soft); border-radius: 10px; padding: 4px; margin-bottom: 10px; }
  .ed-tabs button { flex: 1; border: 0; background: none; padding: 7px; border-radius: 7px; font-weight: 600; font-size: .88rem; font-family: inherit; cursor: pointer; color: var(--muted); }
  .ed-tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .ed-stage { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); touch-action: none; display: block;
              background: repeating-conic-gradient(#ece9e1 0 25%, #fff 0 50%) 0 0 / 18px 18px; }
  .ed-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .ed-zoom { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; font-weight: 600; font-size: .85rem; }
  .ed-zoom input { flex: 1; }
  .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 600; letter-spacing: .02em; }
  #modal-root .dlg.wide img { width: 100%; max-height: 80vh; object-fit: contain; display: block; }
  #toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 30; display: grid; gap: 8px; width: min(440px, 92vw); }
  .toast { background: var(--ink); color: #fff; padding: 11px 15px; border-radius: 10px; font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .toast.err { background: var(--danger); }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>
"use strict";
const $app = document.getElementById("app");
let ME = null, pollTimer = null, NOTICE = "", PROVIDERS = null;
const GOOGLE_ERRORS = {
  cancelled: "Google sign-in was cancelled.", state: "That sign-in expired or was started in another browser. Try again.",
  exchange: "Couldn't reach Google. Try again in a moment.", token: "Google sign-in failed. Try again.", error: "Google sign-in failed. Try again.",
  unverified: "Your Google account's email address isn't verified yet.", other_google: "This email is already linked to a different Google account.",
  suspended: "This studio account is suspended. Contact support to restore access.", closed: "Sign-ups are closed. Ask for an account to be created for you.",
  rate: "Too many attempts. Wait a few minutes and try again.", expired: "That invitation or sign-up has expired. Ask for a new one.",
  wrong_email: "Use the Google account of the address that was invited, or set a password below.",
  exists: "This email already has an account. Sign in instead.",
};
const G_LOGO = `<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>`;

/* ------------------------------------------------------------------ helpers */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtBytes = n => n >= 1073741824 ? (n / 1073741824).toFixed(1) + " GB" : n >= 1048576 ? (n / 1048576).toFixed(0) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "No date";
const num = n => Number(n).toLocaleString();
const browserTz = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { return ""; } };

const onAuthPage = () => /^#\/(login|signup|google-finish|forgot|reset|join)\b/.test(location.hash);
const can = p => !!(ME && ME.user.permissions && ME.user.permissions.includes(p));
// the server refuses these anyway; hiding them saves people a "your role can't" message
new MutationObserver(() => $app.querySelectorAll("[data-need]").forEach(el => { if (!can(el.dataset.need)) el.remove(); }))
  .observe($app, { childList: true, subtree: true });  // signed-out pages: no redirect
class ApiError extends Error { constructor(status, message, code) { super(message); this.status = status; this.code = code; } }
async function api(method, url, body) {
  const opt = { method, headers: { "X-PF": "1" }, credentials: "same-origin" };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt);
  let data = null; try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && !url.startsWith("/api/auth/login") && !url.startsWith("/api/auth/signup")) {
    ME = null; if (!onAuthPage()) location.hash = "#/login";
    throw new ApiError(401, "Please sign in.", "auth");
  }
  if (r.status === 403 && data && data.error === "suspended" && !url.startsWith("/api/auth/login")) {
    ME = null; NOTICE = data.message; if (!onAuthPage()) location.hash = "#/login";
    throw new ApiError(403, data.message, "auth");  // "auth": the login page shows it, not a toast
  }
  if (!r.ok) throw new ApiError(r.status, (data && data.message) || "Something went wrong.", data && data.error);
  return data;
}
function toast(msg, bad) {
  const t = document.createElement("div"); t.className = "toast" + (bad ? " err" : ""); t.textContent = msg;
  document.getElementById("toasts").appendChild(t); setTimeout(() => t.remove(), bad ? 6000 : 3200);
}
const fail = e => { if (e.code !== "auth") toast(e.message || "Something went wrong.", true); };

function applyBrand(color) {
  const c = /^#[0-9a-f]{6}$/i.test(color) ? color : "#f0c52f";
  const [r, g, b] = [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const dark = (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55;
  document.documentElement.style.setProperty("--brand", c);
  document.documentElement.style.setProperty("--brand-ink", dark ? "#1b1406" : "#ffffff");
}

function modal(html, { wide = false, onMount, cls = "" } = {}) {
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="ov"><div class="dlg${wide ? " wide" : ""}${cls ? " " + cls : ""}">${html}</div></div>`;
  const ov = root.firstChild, close = () => { root.innerHTML = ""; document.removeEventListener("keydown", esc_); };
  const esc_ = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", esc_);
  ov.addEventListener("mousedown", e => { if (e.target === ov) close(); });
  ov.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  if (onMount) onMount(ov, close);
  const first = ov.querySelector("input:not([type=hidden]), select, textarea"); if (first && !wide) first.focus();
  return close;
}
function confirmBox(title, text, okLabel, danger) {
  return new Promise(res => {
    const close = modal(`<h2>${esc(title)}</h2><p class="muted">${esc(text)}</p>
      <div class="row" style="justify-content:flex-end;margin-top:18px">
        <button class="btn" data-close>Cancel</button><button class="btn ${danger ? "danger" : "primary"}" id="ok">${esc(okLabel)}</button></div>`,
      { onMount: ov => { ov.querySelector("#ok").onclick = () => { close(); res(true); }; ov.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => res(false))); } });
  });
}
const stopPoll = () => {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (typeof camTimer !== "undefined" && camTimer) { clearInterval(camTimer); camTimer = null; }
};

/* ------------------------------------------------------------------ shell */
function shell(inner, active) {
  const a = ME.account, init = esc((a.company || "?").trim().charAt(0).toUpperCase());
  const link = (h, t, k) => `<a href="${h}" class="${active === k ? "on" : ""}">${t}</a>`;
  $app.innerHTML = `<header class="top"><div class="bar">
      <a class="logo" href="#/" title="${esc(a.company)}">${a.logo_url ? `<img class="hdrlogo" src="${esc(a.logo_url)}" alt="${esc(a.company)}" style="${a.logo_badge_light ? BADGE(26, false) + "height:26px" : ""}">` : `<i>${init}</i><span>${esc(a.company)}</span>`}</a>
      <nav>${link("#/", "Overview", "home")}${link("#/clients", "Clients", "clients")}${link("#/events", "Events", "events")}${link("#/calendar", "Calendar", "calendar")}${link("#/tasks", "Tasks", "tasks")}${link("#/billing", "Billing", "billing")}${link("#/team", "Team", "team")}${link("#/settings", "Settings", "settings")}${ME.user.platform_admin ? `<a href="/admin">Admin</a>` : ""}</nav>
      <div class="who">${ME.user.role !== "owner" ? `<span class="badge" title="Your role">${esc(ME.user.role_label)}</span>` : ""}<span class="badge">${esc(a.plan_label)} plan</span><button class="btn sm" id="logout">Sign out</button></div>
    </div></header><main>${inner}</main>`;
  document.getElementById("logout").onclick = async () => { try { await api("POST", "/api/auth/logout"); } catch (e) {} ME = null; location.hash = "#/login"; };
}
const emptyState = (title, text, btn) => `<div class="card empty"><b>${esc(title)}</b>${esc(text)}${btn ? `<div style="margin-top:14px">${btn}</div>` : ""}</div>`;

/* ------------------------------------------------------------------ login / signup */
async function viewLogin(mode = "login") {
  stopPoll(); document.title = "Sign in · Photo Finder Studio"; applyBrand();
  if (!PROVIDERS) { try { PROVIDERS = await api("GET", "/api/auth/providers"); } catch (e) { PROVIDERS = { google: false }; } }
  const google = PROVIDERS.google ? `<a class="gbtn" href="/api/auth/google/start">${G_LOGO}<span>${mode === "signup" ? "Sign up with Google" : "Continue with Google"}</span></a>
      <div class="or">or with email</div>` : "";
  $app.innerHTML = `<div class="auth"><h1>Photo Finder Studio</h1>
    <p class="sub muted">Deliver event photos by face search.</p>
    <div class="card"><div class="tabs"><button data-m="login" class="${mode === "login" ? "on" : ""}">Sign in</button>
      <button data-m="signup" class="${mode === "signup" ? "on" : ""}">Create account</button></div>
      <div id="amsg"></div>${google}
      <form id="aform">
        ${mode === "signup" ? `<label class="f"><span>Company or studio name</span><input name="company" required maxlength="100" autocomplete="organization"></label>
          <label class="f"><span>Your name</span><input name="name" maxlength="100" autocomplete="name"></label>` : ""}
        <label class="f"><span>Email</span><input name="email" type="email" required autocomplete="email"></label>
        <label class="f"><span>Password ${mode === "signup" ? "<small>(at least 8 characters)</small>" : ""}</span>
          <input name="password" type="password" required minlength="${mode === "signup" ? 8 : 1}" autocomplete="${mode === "signup" ? "new-password" : "current-password"}"></label>
        ${mode === "login" ? `<p class="small" style="margin:-4px 0 14px;text-align:right"><a href="#/forgot">Forgot password?</a></p>` : ""}
        <button class="btn primary" style="width:100%;justify-content:center" id="go">${mode === "signup" ? "Create account" : "Sign in"}</button>
      </form></div></div>`;
  if (NOTICE) document.getElementById("amsg").innerHTML = `<div class="msg err">${esc(NOTICE)}</div>`;  // kept until the next sign-in attempt
  $app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => viewLogin(b.dataset.m));
  document.getElementById("aform").onsubmit = async e => {
    e.preventDefault(); NOTICE = "";
    const f = Object.fromEntries(new FormData(e.target)), btn = document.getElementById("go"); btn.disabled = true;
    if (mode === "signup") f.timezone = browserTz();  // link expiry dates follow the studio's own calendar
    try {
      ME = await api("POST", mode === "signup" ? "/api/auth/signup" : "/api/auth/login", f);
      if (mode === "login") ME = await api("GET", "/api/auth/me");
      applyBrand(ME.account.brand_color); location.hash = "#/";
    } catch (err) { document.getElementById("amsg").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; btn.disabled = false; }
  };
}

let RESET_TOKEN = "";

/* ------------------------------------------------------------------ team */
async function viewTeam() {
  stopPoll(); document.title = "Team · Photo Finder Studio";
  const t = await api("GET", "/api/team"), s = t.seats;
  const roleSel = (name, cur, opts) => `<select name="${name}">${opts.map(r => `<option value="${r}" ${r === cur ? "selected" : ""}>${esc(t.roles.find(x => x.role === r).label)}</option>`).join("")}</select>`;
  const full = s.limit != null && s.used >= s.limit;
  shell(`<div class="head"><div><h1>Team</h1><div class="muted">${num(s.used)} of ${s.limit == null ? "unlimited" : num(s.limit)} seats used${s.limit != null ? " (pending invitations count until they expire)" : ""}</div></div></div>
    ${teamTabs("members")}
    ${t.can_manage ? `<div class="card"><h2>Invite someone</h2>
      ${full ? `<div class="msg err">Every seat on your plan is taken. Remove someone or cancel an invitation first, or upgrade.</div>` : ""}
      <form id="iform"><div class="two"><label class="f"><span>Work email</span><input name="email" type="email" required autocomplete="off" placeholder="name@yourstudio.com"></label>
        <label class="f"><span>Name <small>(optional)</small></span><input name="name" maxlength="100"></label></div>
        <label class="f"><span>Role</span>${roleSel("role", "photographer", t.assignable)}</label>
        <div class="row"><button class="btn primary" ${full ? "disabled" : ""}>Send invitation</button><span class="muted small">They get an email with a link to join. It works for 7 days. The address must not already have a Photo Finder account.</span></div></form></div>` : ""}
    <div class="card" style="padding:6px 8px"><table><thead><tr><th>Member</th><th>Role</th><th>Last active</th><th></th></tr></thead><tbody>
      ${t.members.map(m => `<tr><td><b>${esc(m.name || m.email)}</b>${m.me ? ` <span class="badge">You</span>` : ""}<div class="muted small">${esc(m.email)}${m.google ? " · Google" : ""}</div></td>
        <td>${m.manageable ? `<span data-member="${m.id}">${roleSel("role", m.role, t.assignable)}</span>` : esc(m.role_label)}</td>
        <td class="small muted">${m.last_seen ? new Date(m.last_seen * 1000).toLocaleDateString() : "Never"}</td>
        <td style="text-align:right">${m.manageable ? `<button class="btn sm danger" data-remove="${m.id}" data-email="${esc(m.email)}">Remove</button>` : ""}</td></tr>`).join("")}
    </tbody></table></div>
    ${t.invites.length ? `<h2>Waiting to join</h2><div class="card" style="padding:6px 8px"><table><thead><tr><th>Email</th><th>Role</th><th>Invited by</th><th>Link</th><th></th></tr></thead><tbody>
      ${t.invites.map(i => `<tr><td>${esc(i.email)}</td><td>${esc(i.role_label)}</td><td class="small muted">${esc(i.invited_by)}</td>
        <td class="small">${i.expired ? `<span class="badge bad">Expired</span>` : "Expires " + new Date(i.expires_at * 1000).toLocaleDateString()}</td>
        <td style="text-align:right">${i.manageable ? `<button class="btn sm" data-resend="${i.id}">Send again</button> <button class="btn sm danger" data-cancel="${i.id}">Cancel</button>` : ""}</td></tr>`).join("")}
    </tbody></table></div>` : ""}
    <details class="card"><summary>What each role can do</summary><table><tbody>
      ${t.roles.map(r => `<tr><td style="width:140px"><b>${esc(r.label)}</b></td><td class="muted">${esc(r.about)}</td></tr>`).join("")}</tbody></table></details>`, "team");
  const f = document.getElementById("iform");
  if (f) f.onsubmit = async e => { e.preventDefault();
    try { const r = await api("POST", "/api/team/invites", Object.fromEntries(new FormData(e.target))); toast(r.message); viewTeam(); } catch (x) { fail(x); } };
  $app.querySelectorAll("[data-member] select").forEach(sel => sel.onchange = async () => {
    try { await api("PATCH", "/api/team/members/" + sel.parentElement.dataset.member, { role: sel.value }); toast("Role changed."); } catch (x) { fail(x); viewTeam(); } });
  $app.querySelectorAll("[data-remove]").forEach(b => b.onclick = async () => {
    if (!await confirmBox(`Remove ${b.dataset.email}?`, "They lose access straight away and are signed out everywhere. Their uploads stay.", "Remove", true)) return;
    try { await api("DELETE", "/api/team/members/" + b.dataset.remove); toast("Removed."); viewTeam(); } catch (x) { fail(x); } });
  $app.querySelectorAll("[data-resend]").forEach(b => b.onclick = async () => {
    try { const r = await api("POST", `/api/team/invites/${b.dataset.resend}/resend`); toast(r.message); viewTeam(); } catch (x) { fail(x); } });
  $app.querySelectorAll("[data-cancel]").forEach(b => b.onclick = async () => {
    try { await api("DELETE", "/api/team/invites/" + b.dataset.cancel); toast("Invitation cancelled."); viewTeam(); } catch (x) { fail(x); } });
}

/* ------------------------------------------------------------------ joining a team from an invitation */
let JOIN_TOKEN = "";
async function viewJoin() {
  stopPoll(); document.title = "Join · Photo Finder Studio"; applyBrand();
  if (!JOIN_TOKEN) { try { JOIN_TOKEN = sessionStorage.getItem("pf_join") || ""; } catch (e) {} }
  if (!PROVIDERS) { try { PROVIDERS = await api("GET", "/api/auth/providers"); } catch (e) { PROVIDERS = { google: false }; } }
  let inv;
  try { inv = await api("POST", "/api/invite/check", { token: JOIN_TOKEN }); }
  catch (e) {
    authCard(e.code === "suspended" ? "Account suspended" : "Invitation expired", e.code === "suspended" ? esc(e.message) : "Invitation links work once, for 7 days. Ask the person who invited you to send it again.",
      `<a class="btn primary" style="width:100%;justify-content:center" href="#/login">Go to sign in</a>`);
    return;
  }
  const notice = NOTICE; NOTICE = "";
  authCard(`Join ${inv.company}`, `${inv.invited_by ? esc(inv.invited_by) + " invited you" : "You're invited"} as <b>${esc(inv.role_label)}</b>. ${esc(inv.about)}`,
    inv.taken ? `<div class="msg err">${esc(inv.email)} already has an account. Sign in instead.</div><a class="btn primary" style="width:100%;justify-content:center" href="#/login">Sign in</a>`
    : `${PROVIDERS.google ? `<a class="gbtn" href="/api/auth/google/start?invite=${encodeURIComponent(JOIN_TOKEN)}">${G_LOGO}<span>Join with Google (${esc(inv.email)})</span></a><div class="or">or set a password</div>` : ""}
      <form id="jform"><label class="f"><span>Email</span><input value="${esc(inv.email)}" readonly></label>
      <label class="f"><span>Your name</span><input name="name" maxlength="100" autocomplete="name" value="${esc(inv.name)}"></label>
      <label class="f"><span>Password <small>(at least 8 characters)</small></span><input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
      <button class="btn primary" style="width:100%;justify-content:center" id="go">Join ${esc(inv.company)}</button></form>`);
  if (notice) authMsg(notice);
  const f = document.getElementById("jform"); if (!f) return;
  f.onsubmit = async e => {
    e.preventDefault(); const d = new FormData(e.target), btn = document.getElementById("go"); btn.disabled = true;
    try {
      await api("POST", "/api/invite/accept", { token: JOIN_TOKEN, name: d.get("name"), password: d.get("password") });
      try { sessionStorage.removeItem("pf_join"); } catch (x) {}
      JOIN_TOKEN = ""; ME = await api("GET", "/api/auth/me"); applyBrand(ME.account.brand_color);
      toast(`Welcome to ${ME.account.company}.`); location.hash = "#/";
    } catch (err) { if (err.code === "expired") return viewJoin(); authMsg(err.message); btn.disabled = false; }
  };
}
function authCard(title, sub, inner) {
  $app.innerHTML = `<div class="auth"><h1>${esc(title)}</h1><p class="sub muted">${sub}</p><div class="card"><div id="amsg"></div>${inner}</div></div>`;
}
const authMsg = (text, ok) => { document.getElementById("amsg").innerHTML = `<div class="msg ${ok ? "ok" : "err"}">${esc(text)}</div>`; };

function viewForgot() {
  stopPoll(); document.title = "Forgot password · Photo Finder Studio"; applyBrand();
  authCard("Forgot your password?", "Enter your account email and we'll send you a link to choose a new one.",
    `<form id="fform"><label class="f"><span>Email</span><input name="email" type="email" required autocomplete="email"></label>
      <button class="btn primary" style="width:100%;justify-content:center" id="go">Send reset link</button></form>
      <p class="small muted" style="margin:14px 0 0;text-align:center"><a href="#/login">Back to sign in</a></p>`);
  document.getElementById("fform").onsubmit = async e => {
    e.preventDefault(); const btn = document.getElementById("go"); btn.disabled = true;
    try {
      const r = await api("POST", "/api/auth/forgot", { email: new FormData(e.target).get("email") });
      authMsg(r.message, true); btn.textContent = "Send again"; setTimeout(() => btn.disabled = false, 30000);
    } catch (err) { authMsg(err.message); btn.disabled = false; }
  };
}

async function viewReset() {
  stopPoll(); document.title = "New password · Photo Finder Studio"; applyBrand();
  let who;
  try { who = await api("POST", "/api/auth/reset/check", { token: RESET_TOKEN }); }
  catch (e) {
    authCard("Link expired", "Reset links work once, for a limited time.",
      `<a class="btn primary" style="width:100%;justify-content:center" href="#/forgot">Send me a new link</a>
       <p class="small muted" style="margin:14px 0 0;text-align:center"><a href="#/login">Back to sign in</a></p>`);
    return;
  }
  authCard("Choose a new password", `For <b>${esc(who.email)}</b>. You'll be signed out on all other devices.`,
    `<form id="rform"><label class="f"><span>New password <small>(at least 8 characters)</small></span><input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
      <label class="f"><span>Repeat it</span><input name="again" type="password" required minlength="8" autocomplete="new-password"></label>
      <button class="btn primary" style="width:100%;justify-content:center" id="go">Save and sign in</button></form>`);
  document.getElementById("rform").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target), btn = document.getElementById("go");
    if (f.get("password") !== f.get("again")) return authMsg("The two passwords don't match.");
    btn.disabled = true;
    try {
      await api("POST", "/api/auth/reset", { token: RESET_TOKEN, password: f.get("password") });
      RESET_TOKEN = ""; ME = await api("GET", "/api/auth/me"); applyBrand(ME.account.brand_color);
      toast("Password changed. You're signed in."); location.hash = "#/";
    } catch (err) {
      if (err.code === "expired") return viewReset();
      authMsg(err.message); btn.disabled = false;
    }
  };
}

async function viewGoogleFinish() {
  stopPoll(); document.title = "Finish sign-up · Photo Finder Studio"; applyBrand();
  let g;
  try { g = await api("GET", "/api/auth/google/pending"); }
  catch (e) { NOTICE = GOOGLE_ERRORS.expired; location.hash = "#/signup"; return; }
  $app.innerHTML = `<div class="auth"><h1>Almost there</h1>
    <p class="sub muted">Signed in with Google as <b>${esc(g.email)}</b>.</p>
    <div class="card"><div id="amsg"></div><form id="gform">
      <label class="f"><span>Company or studio name</span><input name="company" required maxlength="100" autocomplete="organization"></label>
      <button class="btn primary" style="width:100%;justify-content:center" id="go">Create account</button></form>
      <p class="small muted" style="margin:14px 0 0;text-align:center"><a href="#/login">Use a different account</a></p></div></div>`;
  document.getElementById("gform").onsubmit = async e => {
    e.preventDefault(); const btn = document.getElementById("go"); btn.disabled = true;
    try {
      ME = await api("POST", "/api/auth/google/complete", { company: new FormData(e.target).get("company"), timezone: browserTz() });
      applyBrand(ME.account.brand_color); location.hash = "#/";
    } catch (err) {
      if (err.code === "expired") { NOTICE = err.message; location.hash = "#/signup"; return; }
      document.getElementById("amsg").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; btn.disabled = false;
    }
  };
}

/* ------------------------------------------------------------------ overview */
function meter(label, used, limit, fmt = num) {
  const pct = limit ? Math.min(100, Math.round(used / limit * 100)) : 0;
  return `<div class="card" style="margin:0"><div class="muted small">${label}</div>
    <div style="font-size:1.4rem;font-weight:700">${fmt(used)}<span class="muted small" style="font-weight:400"> / ${limit == null ? "Unlimited" : fmt(limit)}</span></div>
    <div class="meter ${pct >= 90 ? "hot" : ""}"><div style="width:${limit ? pct : 4}%"></div></div></div>`;
}
const statusBadge = e => e.processing ? `<span class="badge busy">Processing ${e.processing}</span>`
  : e.status === "published" ? `<span class="badge pub">Published</span>` : `<span class="badge">Draft</span>`;

async function viewHome() {
  stopPoll(); document.title = "Overview · Photo Finder Studio";
  ME = await api("GET", "/api/auth/me"); const [events, clients] = await Promise.all([api("GET", "/api/events"), api("GET", "/api/clients")]);
  const u = ME.usage, l = ME.limits;
  shell(`<div class="head"><div><h1>Welcome, ${esc(ME.account.company)}</h1><div class="muted">${clients.length} client${clients.length === 1 ? "" : "s"} · ${events.length} event${events.length === 1 ? "" : "s"}</div></div>
      <div class="row"><button class="btn" data-act="new-client" data-need="clients">New client</button><button class="btn primary" data-act="new-event" data-need="events">New event</button></div></div>
    <div class="stats" style="margin-bottom:24px">${meter("Events", u.events, l.events)}${meter("Photos", u.photos, l.photos)}${meter("Storage", u.storage, l.storage, fmtBytes)}</div>
    <h2>Recent events</h2>${events.length ? eventTable(events.slice(0, 8)) : emptyState("No events yet", "Add a client, then create an event for them and upload the photos.",
      `<button class="btn primary" data-act="new-event" data-need="events">Create your first event</button>`)}`, "home");
  wire();
}

function eventTable(events, withClient = true) {
  return `<div class="card" style="padding:6px 8px"><table><thead><tr><th>Event</th>${withClient ? "<th>Client</th>" : ""}<th>Date</th><th>Photos</th><th>Guests</th><th></th></tr></thead><tbody>
    ${events.map(e => `<tr class="click" data-href="#/events/${e.id}"><td><b>${esc(e.name)}</b></td>${withClient ? `<td>${esc(e.client_name)}</td>` : ""}
      <td class="muted">${fmtDate(e.event_date)}</td><td>${num(e.ready)}</td><td class="muted">${num(e.found)} found / ${num(e.searches)}</td><td>${statusBadge(e)}</td></tr>`).join("")}
    </tbody></table></div>`;
}

async function viewClient(id) {
  stopPoll();
  const [clients, events] = await Promise.all([api("GET", "/api/clients"), api("GET", "/api/events?client_id=" + id)]);
  const c = clients.find(x => x.id == id); if (!c) { toast("Client not found.", true); location.hash = "#/clients"; return; }
  document.title = c.name + " · Photo Finder Studio";
  shell(`<div class="crumbs"><a href="#/clients">Clients</a> /</div><div class="head"><div><h1>${esc(c.name)}</h1></div>
      <button class="btn primary" data-act="new-event" data-need="events" data-client="${c.id}">New event</button></div>
    <h2>Events</h2>${events.length ? eventTable(events, false) : emptyState("No events for this client", "Create an event, upload the photos, then share the link.", `<button class="btn primary" data-act="new-event" data-need="events" data-client="${c.id}">New event</button>`)}
    <details class="card" style="margin-top:22px" data-need="clients"><summary>Client details</summary>
      <form id="cform"><div class="two"><label class="f"><span>Name</span><input name="name" required maxlength="120" value="${esc(c.name)}"></label>
        <label class="f"><span>Email</span><input name="email" type="email" value="${esc(c.email)}"></label>
        <label class="f"><span>Phone</span><input name="phone" value="${esc(c.phone)}"></label></div>
        <label class="f"><span>Notes</span><textarea name="notes" rows="3" maxlength="2000">${esc(c.notes)}</textarea></label>
        <div class="row"><button class="btn primary">Save</button><button type="button" class="btn danger" id="delc">Delete client</button></div></form></details>`, "clients");
  wire();
  document.getElementById("cform").onsubmit = async e => { e.preventDefault(); try { await api("PATCH", "/api/clients/" + id, Object.fromEntries(new FormData(e.target))); toast("Saved."); viewClient(id); } catch (x) { fail(x); } };
  document.getElementById("delc").onclick = async () => {
    if (!await confirmBox("Delete this client?", "This can't be undone. A client with events can't be deleted.", "Delete client", true)) return;
    try { await api("DELETE", "/api/clients/" + id); location.hash = "#/clients"; } catch (x) { fail(x); }
  };
}

function paintTop() {
  const e = EV, pub = e.status === "published";
  document.getElementById("ev-top").innerHTML = `<div class="crumbs"><a href="#/clients">Clients</a> / <a href="#/clients/${e.client_id}">${esc(e.client_name)}</a> /</div>
    <div class="head"><div><h1>${esc(e.name)}</h1><div class="muted" style="margin-top:4px">${fmtDate(e.event_date)} · ${statusBadge(e)}
      ${e.expires_at ? ` · link expires ${fmtDate(e.expires_at)}` : ""}</div></div>
      <button class="btn ${pub ? "" : "primary"}" id="pubbtn" data-need="events">${pub ? "Unpublish" : "Publish for guests"}</button></div>`;
  document.getElementById("pubbtn").onclick = async () => {
    if (!pub && e.ready === 0 && !await confirmBox("Publish with no photos?", "Guests will see a page saying the photos aren't ready yet.", "Publish anyway")) return;
    try { EV = await api("PATCH", "/api/events/" + e.id, { status: pub ? "draft" : "published" }); paintTop(); paintShare(); toast(pub ? "Event is now hidden from guests." : "Published. Guests can open the link."); } catch (x) { fail(x); }
  };
}

function paintShare() {
  const e = EV, live = e.status === "published", wa = "https://wa.me/?text=" + encodeURIComponent(`${e.name}: find your photos with a selfie\n${e.url}`);
  document.getElementById("ev-share").innerHTML = `<div class="card"><h2>Share with guests</h2><div class="share"><div>
      <div class="row"><input class="grow" readonly id="eurl" value="${esc(e.url)}"><button class="btn" id="copy">Copy link</button></div>
      <div class="row" style="margin-top:10px"><a class="btn sm" href="${esc(e.url)}" target="_blank" rel="noopener">Open guest page</a>
        <a class="btn sm" href="${wa}" target="_blank" rel="noopener">Share on WhatsApp</a>
        <a class="btn sm" href="/api/events/${e.id}/qr.png" download="${esc(e.slug)}-qr.png">Download QR</a></div>
      <p class="small ${live ? "muted" : ""}" style="margin:12px 0 0;${live ? "" : "color:var(--warn)"}">${live ? "Guests open the link, take a selfie and see only their own photos." : "Not visible to guests until you publish the event."}</p>
      ${e.url.includes("localhost") || e.url.includes("127.0.0.1") ? `<p class="small" style="color:var(--warn);margin:8px 0 0">This link only works on this computer. Open the dashboard using the computer's network address, or set a public URL, so phones can reach it.</p>` : ""}

  document.getElementById("copy").onclick = async () => { try { await navigator.clipboard.writeText(e.url); } catch (x) { document.getElementById("eurl").select(); document.execCommand("copy"); } toast("Link copied."); };

function paintClient() {
  const e = EV, c = e.client, el = document.getElementById("ev-client"); if (!el) return;

    ${c.enabled ? `<p class="small muted" style="margin:8px 0 12px">A private link that shows all ${num(e.ready)} photos${e.videos ? ` and ${num(e.videos)} video${e.videos === 1 ? "" : "s"}` : ""}, no selfie needed. It works even while the event is hidden from guests. Opened ${num(c.views)} time${c.views === 1 ? "" : "s"}.</p>
      <div class="row"><input class="grow" readonly id="cl-url" value="${esc(c.url)}"><button class="btn" id="cl-copy">Copy link</button></div>
      <div class="row" style="margin-top:10px"><a class="btn sm" href="${esc(c.url)}" target="_blank" rel="noopener">Open client gallery</a>
        <a class="btn sm" href="${wa}" target="_blank" rel="noopener">Share on WhatsApp</a></div>
      <div class="row" style="margin-top:14px;gap:16px" data-need="events">
        <label class="check" style="margin:0"><input type="checkbox" id="cl-dl" ${c.download ? "checked" : ""}> Client can download (single photos and "Download all")</label></div>
      <div class="row" style="margin-top:10px" data-need="events">
        <span class="small">${c.has_pin ? "🔒 <b>PIN is on.</b> Send it to the client separately from the link." : "No PIN: anyone with the link can see every photo."}</span>
        <button class="btn sm" id="cl-pin">${c.has_pin ? "Change PIN" : "Add a PIN"}</button>${c.has_pin ? `<button class="btn sm" id="cl-nopin">Remove PIN</button>` : ""}
        <button class="btn sm danger" id="cl-reset">New link</button></div>`
    : `<p class="small muted" style="margin:8px 0 0">Turn on to give your client a private link to <b>all</b> the photos of this event, separate from the guests' selfie search.</p>`}</div>`;
  const save = async (fields, msg) => { try { EV = await api("PATCH", "/api/events/" + e.id, fields); paintClient(); toast(msg); } catch (x) { fail(x); paintClient(); } };
  const on = document.getElementById("cl-on"); if (on) on.onchange = () => save({ client_enabled: on.checked }, on.checked ? "Client gallery is on." : "Client gallery is off. The link stops working.");
  const dl = document.getElementById("cl-dl"); if (dl) dl.onchange = () => save({ client_download: dl.checked }, dl.checked ? "Client can download." : "Downloads turned off for the client.");
  const cp = document.getElementById("cl-copy"); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(c.url); } catch (x) { document.getElementById("cl-url").select(); document.execCommand("copy"); } toast("Link copied."); };
  const setPin = pin => api("POST", `/api/events/${e.id}/client-pin`, { pin }).then(r => { EV = r; paintClient(); toast(pin ? "PIN saved. Send it to the client." : "PIN removed."); }).catch(fail);
  const pb = document.getElementById("cl-pin"); if (pb) pb.onclick = () => modal(`<h2>${c.has_pin ? "Change" : "Add"} the PIN</h2>
      <p class="muted">4 to 8 digits. The client enters it once per device. Changing it locks out every device that used the old one.</p>
      <form id="pf"><label class="f"><span>PIN</span><input name="pin" inputmode="numeric" pattern="\\d{4,8}" maxlength="8" required autocomplete="off"></label>

  const nb = document.getElementById("cl-nopin"); if (nb) nb.onclick = async () => { if (await confirmBox("Remove the PIN?", "Anyone with the link will see every photo.", "Remove PIN", true)) setPin(""); };
  const rb = document.getElementById("cl-reset"); if (rb) rb.onclick = async () => {
    if (!await confirmBox("Make a new link?", "The current client link stops working straight away. Send the new one to your client.", "New link", true)) return;
    try { EV = await api("POST", `/api/events/${e.id}/client-link/reset`); paintClient(); toast("New link made."); } catch (x) { fail(x); } };

function paintStatus() {
  const e = EV, el = document.getElementById("ev-status"); if (!el) return;
  const bits = [`<span><b>${num(e.ready)}</b> ready</span>`];
  if (e.processing) bits.push(`<span class="badge busy">${num(e.processing)} processing…</span>`);
  if (e.failed) bits.push(`<span class="badge bad">${num(e.failed)} failed</span> <button class="btn sm" id="retry" data-need="upload">Retry failed</button>`);
  const pct = e.photos ? Math.round((e.ready + e.failed) / e.photos * 100) : 100;

function startPoll() {
  stopPoll();
  pollTimer = setInterval(async () => {
    if (!EV || (!EV.processing && !(UP && UP.active))) return;
    const before = EV.ready + "/" + EV.failed + "/" + EV.processing;
    await refreshEvent(before);
  }, 2000);
}
async function refreshEvent(before) {
  try {
    const e = await api("GET", "/api/events/" + EV.id); EV = e; paintStatus(); paintCounts();
    const after = e.ready + "/" + e.failed + "/" + e.processing;
    if (before === undefined || before !== after) { paintTop(); paintClient(); loadVendors(); await loadPhotos(true); }
    if (!e.processing) { paintUpload(); }
  } catch (x) { /* a transient error: the next poll will try again */ }
}

/* upload */
function paintUpload() {
  const el = document.getElementById("ev-upload"); if (!el || (UP && UP.active)) return;
  el.innerHTML = `<div class="drop" id="drop"><b>Drag photos here</b><span class="muted">JPG, PNG, WebP or HEIC · up to ${ME.max_file_mb || 60} MB each</span>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" id="pickf">Choose photos</button><button class="btn" id="pickd">Choose a folder</button></div>
      <input type="file" id="fin" multiple accept="image/*,.heic,.heif" hidden><input type="file" id="din" webkitdirectory multiple hidden></div>
    <div class="prog" id="prog"></div>`;
  const drop = document.getElementById("drop"), fin = document.getElementById("fin"), din = document.getElementById("din");
  document.getElementById("pickf").onclick = () => fin.click(); document.getElementById("pickd").onclick = () => din.click();
  fin.onchange = () => { startUpload([...fin.files]); fin.value = ""; }; din.onchange = () => { startUpload([...din.files]); din.value = ""; };
  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => startUpload([...e.dataTransfer.files]));
  if (UP && !UP.active) showUploadSummary();
}
function postBatch(eid, batch, onProgress) {
  return new Promise(resolve => {
    const x = new XMLHttpRequest(); x.open("POST", `/api/events/${eid}/photos`); x.setRequestHeader("X-PF", "1");
    x.upload.onprogress = e => onProgress(e.loaded);
    x.onload = () => { let b = null; try { b = JSON.parse(x.responseText); } catch (e) {} resolve({ status: x.status, body: b }); };
    x.onerror = () => resolve({ status: 0, body: null });
    const fd = new FormData(); batch.forEach(f => fd.append("files", f, f.name)); x.send(fd);
  });
}
async function startUpload(all) {
  if (UP && UP.active) return toast("An upload is already running.", true);
  const ok = all.filter(f => /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
  if (!ok.length) return toast("No photos found in that selection.", true);
  const eid = EV.id, BATCH = 6, CONC = 3, total = ok.reduce((s, f) => s + f.size, 0);
  UP = { active: true, eid, files: ok.length, skipped: all.length - ok.length, done: 0, queued: 0, dup: 0, rejected: [], failedBatches: 0 };
  const loaded = new Map(); let finishedBytes = 0, next = 0;
  const batches = []; for (let i = 0; i < ok.length; i += BATCH) batches.push(ok.slice(i, i + BATCH));
  const draw = () => {
    const bytes = finishedBytes + [...loaded.values()].reduce((a, b) => a + b, 0), pct = Math.min(100, Math.round(bytes / total * 100));
    const p = document.getElementById("prog"); if (p) p.innerHTML = `<div class="row small" style="justify-content:space-between"><span><b>Uploading</b> ${UP.done} of ${UP.files} photos</span><span>${pct}%</span></div><div class="meter"><div style="width:${pct}%"></div></div>`;
  };
  const drop = document.getElementById("drop"); if (drop) drop.style.opacity = .5;
  draw();
  async function worker() {
    while (next < batches.length) {
      const idx = next++, b = batches[idx], size = b.reduce((s, f) => s + f.size, 0);
      const r = await postBatch(eid, b, n => { loaded.set(idx, n); draw(); });
      loaded.delete(idx); finishedBytes += size; UP.done += b.length;
      if (r.status === 200 && r.body) r.body.results.forEach(x => { if (x.status === "queued") UP.queued++; else if (x.status === "duplicate") UP.dup++; else UP.rejected.push(x); });
      else { UP.failedBatches++; b.forEach(f => UP.rejected.push({ name: f.name, error: r.status === 401 ? "Signed out. Sign in again." : (r.body && r.body.message) || "Upload failed (network?)." })); }
      draw();
      if (UP.queued && UP.queued % 12 < BATCH && EV && EV.id === eid) refreshEvent();
    }
  }
  await Promise.all(Array.from({ length: Math.min(CONC, batches.length) }, worker));
  UP.active = false;
  if (EV && EV.id === eid) { await refreshEvent(); paintUpload(); startPoll(); }
}
function showUploadSummary() {
  const p = document.getElementById("prog"); if (!p || !UP) return;
  const u = UP, parts = [`<b>${u.queued}</b> uploaded`]; if (u.dup) parts.push(`${u.dup} already there`); if (u.rejected.length) parts.push(`<span style="color:var(--danger)">${u.rejected.length} not added</span>`); if (u.skipped) parts.push(`${u.skipped} non-photo files skipped`);
  p.innerHTML = `<div class="msg ${u.rejected.length ? "err" : "ok"}" style="margin:0">${parts.join(" · ")}${u.rejected.length ? `<details style="margin-top:6px"><summary class="small">See details</summary><ul class="small" style="margin:6px 0 0;padding-left:18px">${u.rejected.slice(0, 50).map(r => `<li>${esc(r.name)}: ${esc(r.error)}</li>`).join("")}${u.rejected.length > 50 ? `<li>…and ${u.rejected.length - 50} more</li>` : ""}</ul></details>` : ""}</div>`;
}

/* ------------------------------------------------------------------ logo: card in Settings + editor */
const LOGO_PX = { small: 32, medium: 48, large: 72 };
// the badge behind a logo: light on the dark pages, dark on the light ones (same as the pages' CSS)
const BADGE = (h, dark) => `background:${dark ? "#f7f4ef" : "#1d1b16"};padding:${Math.max(3, h >> 3)}px ${Math.max(6, h >> 2)}px;border-radius:${Math.max(4, Math.floor(h / 6))}px;`;
const DARK_BG = [20, 16, 14], LIGHT_BG = [247, 246, 242];
// Same rule as the server (studio/branding.needs_badge): if at least 5% of the visible logo has under 2:1
// contrast with the page background, it gets a badge behind it there.
function needsBadge(c, bgRGB = DARK_BG) {
  const k = Math.min(1, 200 / Math.max(c.width, c.height)), t = document.createElement("canvas");
  t.width = Math.max(1, Math.round(c.width * k)); t.height = Math.max(1, Math.round(c.height * k));
  const g = t.getContext("2d", { willReadFrequently: true }); g.drawImage(c, 0, 0, t.width, t.height);
  const p = g.getImageData(0, 0, t.width, t.height).data;
  const lin = v => (v /= 255) <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
  const lum = (r, gg, b) => 0.2126 * lin(r) + 0.7152 * lin(gg) + 0.0722 * lin(b);
  const bg = lum(...bgRGB);
  let w = 0, faint = 0;
  for (let i = 0; i < p.length; i += 4) if (p[i + 3] > 16) {
    const l = lum(p[i], p[i + 1], p[i + 2]);
    w += p[i + 3]; if ((Math.max(l, bg) + 0.05) / (Math.min(l, bg) + 0.05) < 2) faint += p[i + 3];
  }
  return w > 0 && faint >= 0.05 * w;
}
