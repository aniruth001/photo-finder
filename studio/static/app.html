// The image after rotation, "white -> transparent" and trimming. Big photos are scaled down first (speed).
function logoSource(img, S) {
  const k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k)), turned = S.rot % 180 !== 0;
  let c = document.createElement("canvas"); c.width = turned ? h : w; c.height = turned ? w : h;
  let g = c.getContext("2d", { willReadFrequently: true });
  g.translate(c.width / 2, c.height / 2); g.rotate(S.rot * Math.PI / 180); g.drawImage(img, -w / 2, -h / 2, w, h);
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (!S.white && !S.trim) return c;
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data, W = c.width, H = c.height;
  if (S.white) for (let i = 0; i < p.length; i += 4) {  // near-white becomes transparent, with a soft edge
    const m = Math.min(p[i], p[i + 1], p[i + 2]);
    if (m > 238) p[i + 3] = 0; else if (m > 205) p[i + 3] = Math.min(p[i + 3], Math.round((238 - m) / 33 * 255));
  }
  if (S.white) g.putImageData(d, 0, 0);
  if (!S.trim) return c;
  // trim: drop edges that are transparent or the same colour as the top-left corner (a plain background)
  const bg = [p[0], p[1], p[2], p[3]];
  const empty = i => p[i + 3] < 10 || (bg[3] > 245 && Math.abs(p[i] - bg[0]) + Math.abs(p[i + 1] - bg[1]) + Math.abs(p[i + 2] - bg[2]) < 30 && p[i + 3] > 245);
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!empty((y * W + x) * 4)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return c;  // nothing left: keep it as it is, the server will refuse an empty image
  const pad = Math.round(Math.max(x1 - x0, y1 - y0) * 0.02);
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
  const t = document.createElement("canvas"); t.width = x1 - x0 + 1; t.height = y1 - y0 + 1;
  t.getContext("2d").drawImage(c, x0, y0, t.width, t.height, 0, 0, t.width, t.height);
  return t;
}

async function logoEditor(file) {
  let img;
  try { img = await loadImage(file); } catch (e) { return toast("We couldn't open that image. Use a PNG, JPG or WebP.", true); }
  const S = { rot: 0, shape: "fit", zoom: 1, ox: 0, oy: 0, trim: true, white: false };
  const SHAPES = { fit: null, wide: 3, square: 1 };
  const SW = 640, SH = 300;  // stage size in canvas pixels
  let src = logoSource(img, S), geo = null;
  modal(`<h2>Your logo</h2>
    <div class="ed-tabs">${[["fit", "Whole logo"], ["wide", "Wide 3:1"], ["square", "Square"]].map(([k, t]) => `<button type="button" data-shape="${k}" class="${k === "fit" ? "on" : ""}">${t}</button>`).join("")}</div>
    <canvas id="ed-stage" width="${SW}" height="${SH}" class="ed-stage" aria-label="Logo editor. Drag to move the image when cropping."></canvas>
    <div class="ed-tools">
      <label class="ed-zoom">Zoom <input type="range" id="ed-zoom" min="1" max="4" step="0.01" value="1" disabled></label>
      <button type="button" class="btn sm" id="ed-left" title="Rotate left">⟲ Rotate</button><button type="button" class="btn sm" id="ed-right" title="Rotate right">⟳</button>
      <button type="button" class="btn sm" id="ed-reset">Reset</button></div>
    <label class="check"><input type="checkbox" id="ed-trim" checked> Trim empty edges</label>
    <label class="check"><input type="checkbox" id="ed-white"> Make the white background transparent <small class="muted" style="font-weight:400">(for JPG logos on the dark guest pages)</small></label>
    <div class="logoprevs"><div class="lp light"><span class="muted small">Light pages and dashboard</span><canvas id="ed-pl" height="96"></canvas></div>
      <div class="lp dark"><span class="small">Dark pages</span><canvas id="ed-pd" height="96"></canvas></div></div>
    <p class="small muted" id="ed-size" style="margin:8px 0 0"></p>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn primary" id="ed-save">Save logo</button></div>`,
  { cls: "edit", onMount: (ov, close) => {
    const stage = ov.querySelector("#ed-stage"), g = stage.getContext("2d"), zoom = ov.querySelector("#ed-zoom");
    const layout = () => {  // where the crop frame and the image sit on the stage
      const A = SHAPES[S.shape];
      if (!A) { const s = Math.min(SW * 0.9 / src.width, SH * 0.86 / src.height); return { A, s, fw: src.width * s, fh: src.height * s }; }
      const fw = Math.min(SW * 0.88, SH * 0.86 * A), fh = fw / A, s = Math.max(fw / src.width, fh / src.height) * S.zoom;
      const mx = Math.max(0, (src.width * s - fw) / 2), my = Math.max(0, (src.height * s - fh) / 2);
      S.ox = Math.max(-mx, Math.min(mx, S.ox)); S.oy = Math.max(-my, Math.min(my, S.oy));  // the image always covers the frame
      return { A, s, fw, fh };
    };
    const output = () => {  // the final image, at the size it will be saved
      const L = layout();
      let ow, oh;
      if (!L.A) { const k = Math.min(1, 1200 / src.width, 600 / src.height); ow = Math.round(src.width * k); oh = Math.round(src.height * k); }
      else { ow = L.A >= 2 ? 1200 : 600; oh = Math.round(ow / L.A); }
      const c = document.createElement("canvas"); c.width = Math.max(1, ow); c.height = Math.max(1, oh);
      const o = c.getContext("2d"), f = L.A ? ow / L.fw : ow / src.width;
      o.imageSmoothingQuality = "high";
      if (!L.A) o.drawImage(src, 0, 0, ow, oh);
      else { const w = src.width * L.s * f, h = src.height * L.s * f; o.drawImage(src, ow / 2 + S.ox * f - w / 2, oh / 2 + S.oy * f - h / 2, w, h); }
      return c;
    };
    const preview = (id, h, dark) => {
      const cv = ov.querySelector(id), out = output(), w = Math.min(h * 5, Math.round(out.width * h / out.height));
      cv.width = w * 2; cv.height = h * 2; cv.style.height = h + "px"; cv.style.width = w + "px";
      const p = cv.getContext("2d"); p.imageSmoothingQuality = "high"; p.drawImage(out, 0, 0, cv.width, cv.height);
      const badge = needsBadge(out, dark ? DARK_BG : LIGHT_BG);
      cv.style.cssText += ";" + (badge ? BADGE(h, dark) : "background:none;padding:0;border-radius:0;");
      return { out, badge };
    };
    let queued = false;
    const draw = () => {
      geo = layout(); g.clearRect(0, 0, SW, SH);
      const cx = SW / 2, cy = SH / 2;
      if (!geo.A) g.drawImage(src, cx - geo.fw / 2, cy - geo.fh / 2, geo.fw, geo.fh);
      else {
        const w = src.width * geo.s, h = src.height * geo.s;
        g.drawImage(src, cx + S.ox - w / 2, cy + S.oy - h / 2, w, h);
        g.fillStyle = "rgba(20,16,0,.55)"; g.beginPath(); g.rect(0, 0, SW, SH);
        g.rect(cx - geo.fw / 2, cy - geo.fh / 2, geo.fw, geo.fh); g.fill("evenodd");
      }
      g.strokeStyle = "#f0c52f"; g.lineWidth = 2; g.setLineDash(geo.A ? [] : [6, 5]);
      g.strokeRect(cx - geo.fw / 2, cy - geo.fh / 2, geo.fw, geo.fh); g.setLineDash([]);
      if (!queued) { queued = true; requestAnimationFrame(() => {
        queued = false; const size = LOGO_PX[ME.account.logo_size] || 48;
        const light = preview("#ed-pl", size, false), { out, badge } = preview("#ed-pd", size, true);
        ov.querySelector("#ed-size").textContent = `Saved as ${out.width} × ${out.height} px PNG.` +
          (badge ? " Parts of it are dark, so on dark pages it sits on a light badge to stay readable." : "") +
          (light.badge ? " Parts of it are light, so on light pages it sits on a dark badge." : ""); }); }
    };
    const rebuild = () => { src = logoSource(img, S); draw(); };
    ov.querySelectorAll("[data-shape]").forEach(b => b.onclick = () => {
      S.shape = b.dataset.shape; S.zoom = 1; S.ox = S.oy = 0; zoom.value = 1; zoom.disabled = !SHAPES[S.shape];
      ov.querySelectorAll("[data-shape]").forEach(x => x.classList.toggle("on", x === b)); stage.style.cursor = SHAPES[S.shape] ? "grab" : "default"; draw(); });
    zoom.oninput = () => { S.zoom = +zoom.value; draw(); };
    ov.querySelector("#ed-left").onclick = () => { S.rot = (S.rot + 270) % 360; S.ox = S.oy = 0; rebuild(); };
    ov.querySelector("#ed-right").onclick = () => { S.rot = (S.rot + 90) % 360; S.ox = S.oy = 0; rebuild(); };
    ov.querySelector("#ed-reset").onclick = () => { Object.assign(S, { rot: 0, zoom: 1, ox: 0, oy: 0 }); zoom.value = 1; rebuild(); };
    ov.querySelector("#ed-trim").onchange = e => { S.trim = e.target.checked; S.ox = S.oy = 0; rebuild(); };
    ov.querySelector("#ed-white").onchange = e => { S.white = e.target.checked; rebuild(); };
    let drag = null;  // move the image inside the crop frame (mouse, pen or finger)
    stage.addEventListener("pointerdown", e => { if (!SHAPES[S.shape]) return; drag = { x: e.clientX, y: e.clientY, ox: S.ox, oy: S.oy }; stage.setPointerCapture(e.pointerId); stage.style.cursor = "grabbing"; });
    stage.addEventListener("pointermove", e => { if (!drag) return; const k = SW / stage.getBoundingClientRect().width;
      S.ox = drag.ox + (e.clientX - drag.x) * k; S.oy = drag.oy + (e.clientY - drag.y) * k; draw(); });
    const end = () => { drag = null; stage.style.cursor = SHAPES[S.shape] ? "grab" : "default"; };
    stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
    stage.addEventListener("wheel", e => { if (!SHAPES[S.shape]) return; e.preventDefault();
      S.zoom = Math.max(1, Math.min(4, S.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08))); zoom.value = S.zoom; draw(); }, { passive: false });
    ov.querySelector("#ed-save").onclick = async e => {
      const btn = e.target; btn.disabled = true; btn.textContent = "Saving…";
      const blob = await new Promise(r => output().toBlob(r, "image/png"));
      const fd = new FormData(); fd.append("file", blob, "logo.png");
      try {
        const r = await fetch("/api/account/logo", { method: "POST", headers: { "X-PF": "1" }, body: fd, credentials: "same-origin" });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new ApiError(r.status, j.message || "Couldn't save the logo.", j.error);
        ME = j; close(); toast("Logo saved."); viewSettings();
      } catch (x) { fail(x); btn.disabled = false; btn.textContent = "Save logo"; }
    };
    draw();
  } });
}

/* ------------------------------------------------------------------ camera upload (FTP) card */
let CAM = null, CAM_PW = "", camTimer = null;
const ago = (t, now) => { const s = Math.max(0, now - t); return s < 60 ? `${s} s ago` : s < 3600 ? `${Math.floor(s / 60)} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : new Date(t * 1000).toLocaleString(); };
async function loadCamera() {
  if (!EV || !can("events")) return;
  try { CAM = await api("GET", `/api/events/${EV.id}/camera`); } catch (x) { return; }
  paintCamera();
}
function camPoll() {  // while a camera login is on, show new photos within a few seconds
  if (camTimer) clearInterval(camTimer);
  camTimer = setInterval(async () => {
    if (!EV || !CAM || !CAM.allowed || !CAM.login || !CAM.login.enabled || !document.getElementById("ev-camera")) return;
    const before = CAM.login.uploads;
    try { CAM = await api("GET", `/api/events/${EV.id}/camera`); } catch (x) { return; }
    paintCamera(); if (CAM.login && CAM.login.uploads !== before) refreshEvent();
  }, 5000);
}
function paintCamera() {
  const el = document.getElementById("ev-camera"); if (!el) return;
  if (!CAM || !CAM.allowed) { el.innerHTML = ""; return; }  // only events the platform admin enabled show this option
  const sv = CAM.server, L = CAM.login, now = CAM.now;
  const row = (k, v, copy) => `<tr><td class="muted" style="width:150px">${k}</td><td><b class="mono">${esc(v)}</b>${copy ? ` <button class="btn sm" data-copy="${esc(v)}">Copy</button>` : ""}</td></tr>`;
  const head = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">Camera upload <span class="muted small" style="font-weight:400">straight from the camera, over FTP</span></h2>
    ${L ? `<span class="badge ${L.enabled ? "pub" : ""}">${L.enabled ? "On" : "Off"}</span>` : ""}</div>`;
  if (!sv.available) {
    el.innerHTML = `<div class="card">${head}<p class="small muted" style="margin:8px 0 0">Not switched on for this server. Whoever runs Studio can turn it on with <code>--ftp-port</code> (see "Camera upload" in STUDIO.md).</p></div>`;
    return;
  }
  if (!L) {
    el.innerHTML = `<div class="card">${head}<p class="small muted" style="margin:8px 0 12px">Give this event its own FTP login. Enter it once in the camera, and every photo it sends lands here and is processed like a normal upload; guests can find them within seconds. The login can only add photos to this event.</p>
      <button class="btn primary" id="cam-new">Set up camera upload</button></div>`;
    document.getElementById("cam-new").onclick = () => camAction("POST");
    return;
  }
  const proto = sv.tls === "required" ? "FTPS (FTP over TLS), required" : sv.tls === "available" ? "FTPS (FTP over TLS) if the camera offers it, else FTP" : "FTP";
  const live = L.last_upload_at ? `Last photo received <b>${ago(L.last_upload_at, now)}</b> · ${num(L.uploads)} photo${L.uploads === 1 ? "" : "s"} from the camera`
    : L.last_login_at ? `The camera connected ${ago(L.last_login_at, now)}; waiting for the first photo.` : "Waiting for the camera to connect.";
  el.innerHTML = `<div class="card">${head}
    <p class="small" style="margin:8px 0 12px">${L.enabled ? live : "Switched off: the camera can't log in."}${L.last_note && !/^Received /.test(L.last_note) ? `<br><span style="color:var(--warn)">Last file: ${esc(L.last_note)}</span>` : ""}</p>
    <table class="small"><tbody>
      ${row("Server", sv.host || location.hostname, true)}${row("Port", String(sv.port), false)}${row("Protocol", proto, false)}
      ${row("Username", L.username, true)}
      <tr><td class="muted">Password</td><td>${CAM_PW ? `<b class="mono">${esc(CAM_PW)}</b> <button class="btn sm" data-copy="${esc(CAM_PW)}">Copy</button>
        <div class="small" style="color:var(--warn);margin-top:4px">Shown only now. Enter it in the camera before leaving this page.</div>` : `<span class="muted">Hidden. Make a new one if you need it again.</span>`}</td></tr>
      ${row("Folder", "/ (any folder works)", false)}${row("Passive mode", "On (PASV)", false)}
    </tbody></table>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="cam-toggle">${L.enabled ? "Turn off" : "Turn on"}</button>
      <button class="btn" id="cam-rotate">New password</button>
      <button class="btn danger" id="cam-del">Remove login</button></div>
    <details style="margin-top:14px"><summary class="small" style="cursor:pointer"><b>How to set up the camera</b></summary><div class="small" style="margin-top:8px;line-height:1.6">
      <ol style="padding-left:18px;margin:0">
        <li>Connect the camera to the internet: the venue Wi-Fi or a phone hotspot.</li>
        <li>In the camera's network menu, add an FTP server with the server, port, username and password above. Choose FTPS (or "FTP over TLS", "Secure FTP") if it is offered. Turn passive mode on.</li>
        <li>Turn on automatic transfer after each shot. For live sharing choose JPEG, a medium or small size is enough: 2 to 4 MB uploads quickly, and face search works just as well. Send full originals later from the dashboard.</li>
        <li>Take a test shot. This card shows "Last photo received" within a few seconds.</li></ol>
      <p style="margin:10px 0 0"><b>Where the menu is</b> (names differ by model and firmware; check yours before the event):<br>
        Canon (R series): Network settings, FTP transfer. · Nikon (Z series): Network menu, Connect to FTP server. · Sony (Alpha): Network, FTP Transfer function.</p>
      <p style="margin:6px 0 0" class="muted">Only cameras with built-in FTP upload work this way. Venue internet decides the speed: a slow connection means photos arrive late, not lost; the camera retries.</p>
    </div></details></div>`;
  el.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast("Copied."); } catch (x) { toast(b.dataset.copy); } });
  document.getElementById("cam-toggle").onclick = () => camAction("PATCH", { enabled: !L.enabled });
  document.getElementById("cam-rotate").onclick = async () => {
    if (!await confirmBox("Make a new password?", "The camera's current password stops working straight away. Enter the new one in the camera.", "New password")) return;
    camAction("POST"); };
  document.getElementById("cam-del").onclick = async () => {
    if (!await confirmBox("Remove the camera login?", "The camera can't send photos to this event any more. Photos already received stay.", "Remove", true)) return;
    CAM_PW = ""; camAction("DELETE"); };
}
async function camAction(method, body) {
  try {
    const r = await api(method, `/api/events/${EV.id}/camera`, body);
    if (r.password) { CAM_PW = r.password; toast("Camera login ready. Enter it in the camera."); }
    CAM = r; paintCamera(); camPoll();
  } catch (x) { fail(x); }
}

/* ------------------------------------------------------------------ billing: estimates and invoices, with a PDF */
const CURS = ["₹", "$", "€", "£"];
const KW = {  // the words that change with the kind (the PDF uses the same ones, studio/estimates.py KINDS)
  estimate: { noun: "Estimate", date: "Estimate date", until: "Valid until", total: "Total package cost", about: "A quotation before the booking" },
  invoice: { noun: "Invoice", date: "Invoice date", until: "Due date", total: "Total amount due", about: "A bill for the client to pay" },
};
const fmtMoney = (v, cur = "₹") => {
  const n = Number(v) || 0, frac = Math.round(n * 100) % 100 !== 0;
  return `${cur} ${n.toLocaleString(cur === "₹" ? "en-IN" : "en-US", { minimumFractionDigits: frac ? 2 : 0, maximumFractionDigits: 2 })}`;
};
const paiseOf = v => Math.round((Number(v) || 0) * 100);
function estTotals(items, discount, taxPct) {  // the same sums the server makes, in paise
  const sub = items.reduce((t, i) => t + (String(i.name || "").trim() ? paiseOf(i.amount) : 0), 0);
  const disc = Math.min(paiseOf(discount), sub), tax = Math.round((sub - disc) * (Number(taxPct) || 0) / 100);
  return { subtotal: sub / 100, discount: disc / 100, tax: tax / 100, total: (sub - disc + tax) / 100 };
}

async function viewEstimate(id, query) {

  if (isNew && !can("clients")) { toast(`Your role (${ME.user.role_label}) can't create estimates or invoices.`, true); location.hash = "#/billing"; return; }
  const [clients, base] = await Promise.all([api("GET", "/api/clients"), api("GET", isNew ? "/api/estimates/defaults" : "/api/estimates/" + id)]);
  const startKind = new URLSearchParams(query || "").get("kind") === "invoice" ? "invoice" : "estimate";
  EST = isNew ? { ...base, id: null, kind: startKind, client_id: null, client_name: "", client_details: "", event_title: "", valid_until: "",
                  items: [{ name: "", description: "", amount: "" }], discount: 0 } : base;
  if (!EST.items.length) EST.items.push({ name: "", description: "", amount: "" });
  EST_DIRTY = false;
  const edit = can("clients"), K = () => KW[EST.kind], label = () => isNew ? base.labels[EST.kind] : EST.label;
  const f = (name, lbl, val, attrs = "") => `<label class="f"><span>${lbl}</span><input name="${name}" value="${esc(val ?? "")}" ${attrs}></label>`;
  const ta = (name, lbl, val, rows, ph) => `<label class="f"><span>${lbl}</span><textarea name="${name}" rows="${rows}" placeholder="${esc(ph)}">${esc(val || "")}</textarea></label>`;
  const kindPick = isNew && edit ? `<div class="card"><h2>What are you making?</h2><div class="kinds" role="radiogroup" aria-label="Type">
      ${Object.entries(KW).map(([k, w]) => `<label class="kind"><input type="radio" name="kind" value="${k}" ${k === EST.kind ? "checked" : ""}>
        <span><b>${w.noun}</b><span class="muted small">${w.about} · will be ${esc(base.labels[k])}</span></span></label>`).join("")}</div></div>` : "";
  shell(`<div class="crumbs"><a href="#/billing">Billing</a> /</div>
    <div class="head"><div><h1 id="est-h"></h1><div class="muted" id="est-sub"></div></div></div>
    ${edit ? "" : `<div class="card small muted">Your role (${esc(ME.user.role_label)}) can view and download estimates and invoices, not change them.</div>`}
    <form id="estf" class="est-grid" autocomplete="off"><fieldset ${edit ? "" : "disabled"} style="border:0;padding:0;margin:0;min-width:0">
      ${kindPick}
      <div class="card"><h2>From</h2>
        <div class="two">${f("company_name", `Company name <small>(printed on it)</small>`, EST.company_name, 'required maxlength="150"')}
          <div>${base.has_logo ? `<label class="check" style="margin-top:26px"><input type="checkbox" name="show_logo" ${EST.show_logo ? "checked" : ""}> Show our logo on the PDF</label>` : `<p class="small muted" style="margin-top:26px">Add a logo in Settings to show it on the PDF.</p>`}</div></div>
        ${ta("company_details", "Address, phone, email, GSTIN <small>(optional)</small>", EST.company_details, 3, "No. 12, MG Road, Chennai 600017\n+91 98400 12345 · hello@yourstudio.in\nGSTIN …")}</div>
      <div class="card"><h2>For</h2>
        <div class="two"><label class="f"><span>Client <small>(optional: fills in the details)</small></span><select name="client_id" id="est-client"><option value="">Not one of my clients</option>
            ${clients.map(c => `<option value="${c.id}" ${c.id === EST.client_id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></label>
          ${f("client_name", "Name on it", EST.client_name, 'required maxlength="150" placeholder="Arun &amp; Anjali"')}</div>
        <div class="two">${ta("client_details", "Client contact <small>(optional)</small>", EST.client_details, 2, "Phone, email, address")}
          ${ta("event_title", "Event <small>(optional)</small>", EST.event_title, 2, "Wedding & Reception\n2-3 Nov 2026, Chennai")}</div>
        <div class="two"><label class="f"><span id="lbl-date"></span><input name="estimate_date" type="date" required value="${esc(EST.estimate_date)}"></label>
          <label class="f"><span><span id="lbl-until"></span> <small>(optional)</small></span><input name="valid_until" type="date" value="${esc(EST.valid_until || "")}"></label></div></div>
      <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Packages</h2>
          <label class="row small" style="gap:6px">Currency <select name="currency" style="width:auto">${CURS.map(c => `<option ${c === EST.currency ? "selected" : ""}>${c}</option>`).join("")}</select></label></div>
        <div id="est-items"></div>
        <button type="button" class="btn" id="est-add">+ Add package</button></div>
      <div class="card"><h2>Discount and tax</h2>
        <div class="three">${f("discount", "Discount <small>(amount)</small>", EST.discount || "", 'type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"')}
          ${f("tax_label", "Tax name", EST.tax_label, 'maxlength="40" placeholder="GST"')}${f("tax_pct", "Tax %", EST.tax_pct || "", 'type="number" min="0" max="100" step="0.01" inputmode="decimal" placeholder="0"')}</div></div>
      <div class="card"><h2>Notes and terms</h2>${ta("notes", "Printed at the bottom <small>(optional)</small>", EST.notes, 4, "50% advance to confirm the date; balance on the event day.\nBank: … · UPI: …")}</div>
    </fieldset>
    <aside class="est-side"><div class="card"><h2>Total</h2><div id="est-tot"></div>
      <div class="est-acts">${edit ? `<button class="btn primary" id="est-save"></button>` : ""}
        <button type="button" class="btn ${edit ? "" : "primary"}" id="est-dl">Download PDF</button>
        <button type="button" class="btn" id="est-open">Open PDF</button>
        ${!isNew && edit && EST.kind === "estimate" ? `<button type="button" class="btn" id="est-bill" title="A new invoice with these packages, dated today">Make invoice</button>` : ""}
        ${!isNew && edit ? `<button type="button" class="btn" id="est-copy">Duplicate</button><button type="button" class="btn danger" id="est-del">Delete</button>` : ""}</div>
      <p class="small muted" id="est-state" style="margin:10px 0 0"></p></div></aside></form>`, "billing");

  const form = document.getElementById("estf"), box = document.getElementById("est-items");
  const paintKind = () => {  // every word that depends on estimate vs invoice
    const w = K();
    document.title = `${isNew ? "New " + w.noun.toLowerCase() : label()} · Photo Finder Studio`;
    document.getElementById("est-h").innerHTML = isNew ? `New ${w.noun.toLowerCase()}` : `${esc(label())} ${kindBadge(EST.kind)}`;
    document.getElementById("est-sub").textContent = isNew ? `It will be ${label()}.`
      : `${EST.ref ? `Made from ${EST.ref} · ` : ""}Last saved ${new Date(EST.updated_at * 1000).toLocaleString()}`;
    document.getElementById("lbl-date").textContent = w.date;
    document.getElementById("lbl-until").textContent = w.until;
    const sv = document.getElementById("est-save"); if (sv) sv.textContent = isNew ? `Save ${w.noun.toLowerCase()}` : "Save changes";
  };
  const paintItems = () => {
    box.innerHTML = EST.items.map((it, i) => `<div class="pkg" data-i="${i}"><div class="pkg-head"><b class="muted">${i + 1}</b>
        <input data-k="name" value="${esc(it.name)}" maxlength="150" placeholder="Package name, e.g. Candid photography" aria-label="Package ${i + 1} name">
        <input data-k="amount" value="${esc(it.amount)}" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Cost" aria-label="Package ${i + 1} cost">
        <button type="button" class="btn sm" data-rm="${i}" title="Remove this package" aria-label="Remove package ${i + 1}" ${EST.items.length === 1 ? "disabled" : ""}>✕</button></div>
      <textarea data-k="description" rows="${Math.min(10, Math.max(2, String(it.description || "").split("\n").length))}" maxlength="3000" placeholder="What's included: one line per point" aria-label="Package ${i + 1} description">${esc(it.description)}</textarea>
      ${EST.items.length > 1 ? `<div class="pkg-move"><button type="button" class="btn sm" data-up="${i}" ${i ? "" : "disabled"} aria-label="Move up">↑</button><button type="button" class="btn sm" data-down="${i}" ${i < EST.items.length - 1 ? "" : "disabled"} aria-label="Move down">↓</button></div>` : ""}</div>`).join("");
    box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { EST.items.splice(+b.dataset.rm, 1); changed(); paintItems(); });
    box.querySelectorAll("[data-up],[data-down]").forEach(b => b.onclick = () => {
      const i = +(b.dataset.up ?? b.dataset.down), j = b.dataset.up != null ? i - 1 : i + 1;
      [EST.items[i], EST.items[j]] = [EST.items[j], EST.items[i]]; changed(); paintItems(); });
  };
  const read = () => {
    const d = Object.fromEntries(new FormData(form));
    return { kind: EST.kind, company_name: d.company_name || "", company_details: d.company_details || "", show_logo: base.has_logo ? !!form.show_logo?.checked : EST.show_logo,
      client_id: d.client_id ? +d.client_id : null, client_name: d.client_name || "", client_details: d.client_details || "", event_title: d.event_title || "",
      estimate_date: d.estimate_date, valid_until: d.valid_until || null, currency: d.currency,
      items: EST.items.map(i => ({ name: i.name || "", description: i.description || "", amount: Number(i.amount) || 0 })),
      discount: Number(d.discount) || 0, tax_label: d.tax_label || "", tax_pct: Number(d.tax_pct) || 0, notes: d.notes || "" };
  };
  const paintTotals = () => {
    const b = read(), t = estTotals(b.items, b.discount, b.tax_pct), cur = b.currency;
    const line = (k, v, cls = "") => `<div class="est-line ${cls}"><span>${k}</span><b>${esc(v)}</b></div>`;
    document.getElementById("est-tot").innerHTML = line("Subtotal", fmtMoney(t.subtotal, cur))
      + (t.discount ? line("Discount", "- " + fmtMoney(t.discount, cur)) : "")
      + (b.tax_pct ? line(`${esc(b.tax_label || "Tax")} (${b.tax_pct}%)`, fmtMoney(t.tax, cur)) : "")
      + line(K().total, fmtMoney(t.total, cur), "grand");
    document.getElementById("est-state").textContent = EST_DIRTY ? "Unsaved changes." : (isNew ? "" : "All changes saved.");
  };
  const changed = () => { EST_DIRTY = true; paintTotals(); };
  box.addEventListener("input", e => {
    const p = e.target.closest(".pkg"); if (p && e.target.dataset.k) EST.items[+p.dataset.i][e.target.dataset.k] = e.target.value;
    if (e.target.tagName === "TEXTAREA") e.target.rows = Math.min(10, Math.max(2, e.target.value.split("\n").length));  // grows with the lines
    changed(); });
  form.addEventListener("input", e => { if (!e.target.closest("#est-items")) changed(); });
  form.addEventListener("change", e => {
    if (e.target.name === "kind") { EST.kind = e.target.value; paintKind(); }
    if (!e.target.closest("#est-items")) changed(); });
  document.getElementById("est-add").onclick = () => { EST.items.push({ name: "", description: "", amount: "" }); changed(); paintItems(); box.querySelector(".pkg:last-child input").focus(); };
  document.getElementById("est-client").onchange = e => {  // fill in from the client record; never overwrite what was typed
    const c = clients.find(x => x.id === +e.target.value); if (!c) return;
    if (!form.client_name.value.trim() || clients.some(x => x.name === form.client_name.value)) form.client_name.value = c.name;
    if (!form.client_details.value.trim()) form.client_details.value = [c.phone, c.email].filter(Boolean).join("\n");
    changed(); };
  paintKind(); paintItems(); paintTotals();

  const save = async (leaving) => {
    const b = read();
    if (!b.items.some(i => i.name.trim())) { toast("Add at least one package with a name.", true); return null; }
    try {
      const r = await api(EST.id ? "PATCH" : "POST", EST.id ? "/api/estimates/" + EST.id : "/api/estimates", b);
      EST_DIRTY = false;
      if (!EST.id) { toast(`${r.label} saved.`); if (!leaving) location.hash = "#/billing/" + r.id; return r; }
      EST = { ...EST, ...r }; paintKind(); paintTotals(); toast("Saved."); return r;
    } catch (x) { fail(x); return null; }
  };
  const pdf = async download => {  // always the saved version: save first if something changed
    let eid = EST.id;
    if (edit && (EST_DIRTY || !eid)) { const r = await save(); if (!r) return; eid = r.id; }
    const url = `/api/estimates/${eid}/pdf${download ? "?download=1" : ""}`;
    if (download) { const a = document.createElement("a"); a.href = url; a.download = ""; document.body.appendChild(a); a.click(); a.remove(); }
    else window.open(url, "_blank", "noopener");
  };
  const copyTo = async (kind, done) => {
    if (EST_DIRTY && !await save()) return;
    try { const r = await api("POST", `/api/estimates/${EST.id}/copy${kind ? "?kind=" + kind : ""}`); toast(done(r)); location.hash = "#/billing/" + r.id; } catch (x) { fail(x); }
  };
  EST_SAVE = save;
  form.onsubmit = e => { e.preventDefault(); save(); };
  document.getElementById("est-dl").onclick = () => pdf(true);
  document.getElementById("est-open").onclick = () => pdf(false);
  const bill = document.getElementById("est-bill"), cp = document.getElementById("est-copy"), del = document.getElementById("est-del");
  if (bill) bill.onclick = async () => {
    if (!await confirmBox(`Make an invoice from ${EST.label}?`, "A new invoice with the same client, packages, discount and tax, dated today. Add a due date, check it, then send it. The estimate stays as it is.", "Make invoice")) return;
    copyTo("invoice", r => `${r.label} made from ${EST.label}.`); };
  if (cp) cp.onclick = () => copyTo("", r => `Copied to ${r.label}.`);
  if (del) del.onclick = async () => {
    if (!await confirmBox(`Delete ${EST.label}?`, "This can't be undone. Its number isn't used again.", `Delete ${K().noun.toLowerCase()}`, true)) return;
    try { await api("DELETE", "/api/estimates/" + EST.id); EST_DIRTY = false; toast(`${EST.label} deleted.`); location.hash = "#/billing"; } catch (x) { fail(x); } };
}

/* ------------------------------------------------------------------ cards that minimise (remembered per browser) */
const isMin = k => { try { return localStorage.getItem("pf_min_" + k) === "1"; } catch (e) { return false; } };
function wireMin(k) {
  const card = document.getElementById(k + "-card"), b = card && card.querySelector("[data-min]"); if (!b) return;
  const set = min => {
    card.classList.toggle("min", min);
    b.textContent = min ? "Maximize" : "Minimize";
    b.setAttribute("aria-expanded", String(!min));
    b.title = min ? "Show this card again" : "Fold this card away";
  };
  set(isMin(k));
  b.onclick = () => { const min = !card.classList.contains("min"); try { localStorage.setItem("pf_min_" + k, min ? "1" : "0"); } catch (e) {} set(min); };
}
function paintCounts() {
  const p = document.getElementById("ph-count"), v = document.getElementById("vd-count");
  if (p) p.textContent = `${num(EV.photos)} photo${EV.photos === 1 ? "" : "s"}`;
  if (v) v.textContent = `${num(VD.items.length)} video${VD.items.length === 1 ? "" : "s"}`;
}

/* ------------------------------------------------------------------ vendor uploads: an upload link per vendor */
let VN = { items: [], loaded: false };
async function loadVendors() {
  if (!EV || !can("events")) return;
  const eid = EV.id;
  try { const items = await api("GET", `/api/events/${eid}/vendors`); if (!EV || EV.id !== eid) return; VN.items = items; VN.loaded = true; } catch (x) { return; }
  paintVendors(); paintPhotos();   // the photos card's "From vendors" chips follow the list
}
function paintVendors() {
  const el = document.getElementById("ev-vendors"); if (!el || !EV) return;
  const cnt = document.getElementById("vn-count");
  if (cnt) cnt.textContent = VN.items.length ? `${VN.items.length} vendor${VN.items.length === 1 ? "" : "s"}` : "";
  const when = t => t ? new Date(t * 1000).toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
  const wa = v => { const d = (v.phone || "").replace(/\D/g, ""), msg = encodeURIComponent(`Hi ${v.name}, please upload your photos and videos for ${EV.name} here:\n${v.url}`);
    return d.length >= 10 ? `https://wa.me/${d}?text=${msg}` : `https://wa.me/?text=${msg}`; };
  el.innerHTML = `<p class="small muted" style="margin:6px 0 0">Give a second shooter, the drone team or the video editor their own upload link. They open it, no account needed,
      and send photos and videos straight into this event, tagged with their name. They can't see any other photos.</p>
    <form class="vn-add" id="vn-form"><input name="name" maxlength="120" placeholder="Vendor name, e.g. Ravi (second shooter)" required aria-label="Vendor name">
      <input name="phone" maxlength="40" placeholder="WhatsApp number (optional)" aria-label="Phone"><button class="btn primary">Create upload link</button></form>
    ${VN.items.length ? `<div class="vn-list">${VN.items.map(v => `<div class="vn ${v.enabled ? "" : "off"}" data-vn="${v.id}">
        <div class="vn-head"><div><b>${esc(v.name)}</b>${v.enabled ? "" : ` <span class="badge">Off</span>`}${v.phone ? `<span class="muted small"> · ${esc(v.phone)}</span>` : ""}
          <div class="small muted" style="margin-top:2px">${v.photos || v.videos ? `${num(v.photos)} photo${v.photos === 1 ? "" : "s"}${v.photos - v.ready - v.failed > 0 ? ` (${num(v.photos - v.ready - v.failed)} processing)` : ""}${v.failed ? ` · ${num(v.failed)} failed` : ""} · ${num(v.videos)} video${v.videos === 1 ? "" : "s"} · ${fmtBytes(v.size)} · last sent ${esc(when(v.last_upload_at))}` : "Nothing sent yet"}</div></div>
          <div class="row">${v.photos ? `<button class="btn sm" data-vn-view>View photos</button>` : ""}<button class="btn sm" data-vn-toggle>${v.enabled ? "Turn off" : "Turn on"}</button>
            <button class="btn sm" data-vn-reset title="Make a new address; the old one stops working">New link</button><button class="btn sm danger" data-vn-del>Delete</button></div></div>
        ${v.enabled ? `<div class="row"><input class="grow" readonly value="${esc(v.url)}" aria-label="Upload link for ${esc(v.name)}"><button class="btn sm" data-vn-copy>Copy link</button>
          <a class="btn sm" href="${wa(v)}" target="_blank" rel="noopener">Send on WhatsApp</a></div>` : `<p class="small muted" style="margin:0">The link is off: it doesn't open and nothing can be sent. What they sent stays in the event.</p>`}
      </div>`).join("")}</div>` : VN.loaded ? `<div class="empty" style="padding:18px"><b>No vendor links yet</b>Add a vendor above and send them the link.</div>` : ""}`;
  document.getElementById("vn-form").onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target;
    try { const v = await api("POST", `/api/events/${EV.id}/vendors`, { name: f.name.value, phone: f.phone.value }); VN.items.push(v); paintVendors(); paintPhotos(); toast(`Upload link ready for ${v.name}. Copy it or send it on WhatsApp.`); } catch (x) { fail(x); }
  };
  el.querySelectorAll("[data-vn]").forEach(row => {
    const v = VN.items.find(x => x.id === +row.dataset.vn), on = (sel, fn) => { const b = row.querySelector(sel); if (b) b.onclick = fn; };
    const put = nv => { VN.items = VN.items.map(x => x.id === nv.id ? nv : x); paintVendors(); };
    on("[data-vn-copy]", async () => { try { await navigator.clipboard.writeText(v.url); } catch (x) { row.querySelector("input").select(); document.execCommand("copy"); } toast("Link copied."); });
    on("[data-vn-view]", () => { PH.filter = "v" + v.id; loadPhotos(true); const c = document.getElementById("photos-card"); if (c) { if (c.classList.contains("min")) c.querySelector("[data-min]").click(); c.scrollIntoView({ behavior: "smooth" }); } });
    on("[data-vn-toggle]", async () => {
      if (v.enabled && !await confirmBox(`Turn off ${v.name}'s link?`, "It stops working at once. What they already sent stays in the event. You can turn it on again.", "Turn off")) return;
      try { put(await api("PATCH", `/api/events/${EV.id}/vendors/${v.id}`, { enabled: !v.enabled })); } catch (x) { fail(x); }
    });
    on("[data-vn-reset]", async () => {
      if (!await confirmBox("Make a new link?", `The link you sent ${v.name} stops working. Send them the new one.`, "New link")) return;
      try { put(await api("POST", `/api/events/${EV.id}/vendors/${v.id}/reset`)); toast("New link made. Send it to " + v.name + "."); } catch (x) { fail(x); }
    });
    on("[data-vn-del]", async () => {
      if (!await confirmBox(`Delete ${v.name}'s link?`, `The link stops working. The ${num(v.photos)} photo${v.photos === 1 ? "" : "s"} and ${num(v.videos)} video${v.videos === 1 ? "" : "s"} they sent stay in the event, but are no longer marked as theirs.`, "Delete link", true)) return;
      try { await api("DELETE", `/api/events/${EV.id}/vendors/${v.id}`); VN.items = VN.items.filter(x => x.id !== v.id); if (PH.filter === "v" + v.id || (PH.filter === "vany" && !VN.items.length)) PH.filter = "all"; paintVendors(); loadPhotos(true); loadVideos(); } catch (x) { fail(x); }
    });
  });
}

/* ------------------------------------------------------------------ the photos the client chose for the album */
let AL = { photos: [], count: 0, note: "", locked: false, sent_at: null, sel: new Set(), loaded: false };
async function loadAlbum() {
  if (!EV) return;
  const eid = EV.id;
  try { const j = await api("GET", `/api/events/${eid}/album`); if (!EV || EV.id !== eid) return; Object.assign(AL, j, { loaded: true }); } catch (x) { return; }
  AL.sel = new Set([...AL.sel].filter(id => AL.photos.some(p => p.id === id)));
  paintAlbum();
}
function paintAlbum() {
  const el = document.getElementById("ev-album"); if (!el || !EV) return;
  const n = AL.photos.length, when = AL.sent_at ? new Date(AL.sent_at * 1000).toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
  document.getElementById("al-count").innerHTML = (n ? `${num(n)} photo${n === 1 ? "" : "s"}` : "") +
    (AL.locked ? `<span class="alb-badge lock">Finalised</span>` : n ? `<span class="alb-badge new">From ${esc(EV.client_name)}</span>` : "");
  const tools = document.getElementById("al-tools");
  tools.innerHTML = AL.sel.size ? `<span class="muted small">${AL.sel.size} selected</span><button class="btn sm danger" id="al-rm" data-need="events">Remove from album</button><button class="btn sm" id="al-clr">Clear</button>`
    : `<button class="btn sm" id="al-ref" title="Check for new picks from the client">Refresh</button>` + (n ? `<button class="btn sm" id="al-names">Copy file names</button>
       <a class="btn sm" href="/api/events/${EV.id}/album.zip" download>Download originals</a>
       <button class="btn sm" id="al-lock" data-need="events">${AL.locked ? "Unlock" : "Finalise"}</button>` : "");
  const how = !EV.client.enabled ? `Your client chooses album photos in the client gallery. <b>Turn on the client gallery above</b> and send them the link.`
    : AL.locked ? `Finalised: the client can see these but can't change them. Unlock to let them change the selection.`
    : `Your client chooses these in the client gallery (Select, then Proceed for album). Finalise when you start designing, so the selection stops changing.`;
  el.innerHTML = `<p class="small muted" style="margin:6px 0 0">${how}${when ? ` Last sent ${esc(when)}.` : ""}</p>
    ${AL.note ? `<div class="alb-note small"><b>Note from ${esc(EV.client_name)}:</b> ${esc(AL.note)}</div>` : ""}
    ${n ? `<div class="photos">${AL.photos.map(p => `<div class="ph" data-apid="${esc(p.id)}" title="${esc(p.name)}">

const VIDEO_RE = /\.(mp4|m4v|mov|webm)$/i;
async function loadVideos() {
  if (!EV) return;

}
function paintVideos() {
  const el = document.getElementById("ev-videos"); if (!el || !EV) return;
  paintCounts();
  const src = v => `/api/events/${EV.id}/videos/${encodeURIComponent(v.id)}`;
  const note = EV.client.enabled ? `Only your client sees these, in the client gallery. Never on the guests' page.`
    : `Videos are only shown in the client gallery. <b>Turn on the client gallery above</b> to share them with ${esc(EV.client_name)}.`;
  const tools = document.getElementById("vd-tools");
  if (tools) tools.innerHTML = VD.sel.size ? `<span class="muted small">${VD.sel.size} selected</span><button class="btn sm danger" id="vd-del" data-need="delete_photos">Delete selected</button><button class="btn sm" id="vd-clr">Clear</button>` : "";
  el.innerHTML = `<p class="small muted" style="margin:6px 0 12px">${note}</p>
    ${can("upload") ? `<div class="drop slim" id="vdrop"><b>Drag videos here</b><span class="muted">MP4, MOV or WebM · up to ${fmtBytes((ME.max_video_mb || 4096) * 1048576)} each · MP4 (H.264) plays on every device</span>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="vpick" ${VD.busy ? "disabled" : ""}>Choose videos</button></div>
      <input type="file" id="vin" multiple accept="video/mp4,video/quicktime,video/webm,.mp4,.m4v,.mov,.webm" hidden></div><div class="prog" id="vprog"></div>` : ""}
    ${VD.items.length ? `<div class="vids">${VD.items.map(v => `<div class="vd" data-vid="${esc(v.id)}" title="${esc(v.name)}">
        <div class="vd-frame"><video preload="metadata" muted playsinline src="${src(v)}#t=0.5"></video><span class="vd-play" aria-hidden="true">▶</span></div>
        <div class="vd-meta"><b>${esc(v.name)}</b><span class="muted small">${fmtBytes(v.size)}${v.vendor ? ` · from ${esc(v.vendor)}` : ""}</span></div>
        <input type="checkbox" data-need="delete_photos" data-vsel="${esc(v.id)}" ${VD.sel.has(v.id) ? "checked" : ""} aria-label="Select ${esc(v.name)}"></div>`).join("")}</div>`
      : `<div class="empty" style="padding:22px"><b>No videos yet</b>Add the highlight film, the first dance, the speeches.</div>`}`;
  el.querySelectorAll("[data-vsel]").forEach(c => c.onclick = ev => { ev.stopPropagation(); c.checked ? VD.sel.add(c.dataset.vsel) : VD.sel.delete(c.dataset.vsel); paintVideos(); });
  el.querySelectorAll(".vd").forEach(t => t.onclick = () => { const v = VD.items.find(x => x.id === t.dataset.vid); if (v) playVideo(v); });
  const pick = document.getElementById("vpick"), vin = document.getElementById("vin"), drop = document.getElementById("vdrop");
  if (pick) {
    pick.onclick = () => vin.click();
    vin.onchange = () => { uploadVideos([...vin.files]); vin.value = ""; };
    ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", e => uploadVideos([...e.dataTransfer.files]));
  }
  const del = document.getElementById("vd-del"), clr = document.getElementById("vd-clr");
  if (clr) clr.onclick = () => { VD.sel.clear(); paintVideos(); };
  if (del) del.onclick = async () => {
    if (!await confirmBox(`Delete ${VD.sel.size} video${VD.sel.size === 1 ? "" : "s"}?`, "They are removed for good, also from the client gallery.", "Delete", true)) return;
    try { const r = await api("POST", `/api/events/${EV.id}/videos/delete`, { ids: [...VD.sel] }); VD.sel.clear(); toast(`Deleted ${r.deleted}.`); loadVideos(); } catch (x) { fail(x); }
  };
}
function playVideo(v) {
  const src = `/api/events/${EV.id}/videos/${encodeURIComponent(v.id)}`;
  modal(`<video class="player" controls autoplay playsinline src="${src}"></video>
    <div class="row" style="justify-content:space-between;padding:10px 6px 2px;color:#fff"><span class="small">${esc(v.name)} · ${fmtBytes(v.size)}</span>
    <span class="row"><a class="btn sm" href="${src}?download=1">Download</a><button class="btn sm" data-close>Close</button></span></div>`,
    { wide: true, onMount: ov => ov.querySelector("video").addEventListener("error", () => toast("This browser can't play that video format. Download it, or upload an MP4 (H.264).", true)) });
}
function sendVideo(eid, file, onProgress) {
  return new Promise(resolve => {
    const x = new XMLHttpRequest(); x.open("POST", `/api/events/${eid}/videos`); x.setRequestHeader("X-PF", "1");
    x.upload.onprogress = e => onProgress(e.loaded);
    x.onload = () => { let b = null; try { b = JSON.parse(x.responseText); } catch (e) {} resolve({ status: x.status, body: b }); };
    x.onerror = () => resolve({ status: 0, body: null });
    const fd = new FormData(); fd.append("files", file, file.name); x.send(fd);
  });
}
async function uploadVideos(all) {
  if (VD.busy) return toast("Videos are already uploading.", true);
  const files = all.filter(f => VIDEO_RE.test(f.name));
  if (!files.length) return toast("No videos in that selection. Use MP4, MOV or WebM.", true);
  const max = (ME.max_video_mb || 4096) * 1048576, big = files.filter(f => f.size > max), ok = files.filter(f => f.size <= max);
  if (big.length) toast(`${big.length} video${big.length === 1 ? " is" : "s are"} over ${fmtBytes(max)} and skipped.`, true);
  if (!ok.length) return;
  const eid = EV.id, total = ok.reduce((s, f) => s + f.size, 0);
  let done = 0, added = 0; const problems = [];
  VD.busy = true; paintVideos();
  const draw = (i, loaded) => {
    const p = document.getElementById("vprog"), pct = Math.min(100, Math.round((done + loaded) / total * 100));
    if (p) p.innerHTML = `<div class="row small" style="justify-content:space-between"><span><b>Uploading</b> video ${i + 1} of ${ok.length}: ${esc(ok[i].name)}</span><span>${pct}%</span></div><div class="meter"><div style="width:${pct}%"></div></div>`;
  };
  for (let i = 0; i < ok.length; i++) {  // one at a time: videos are big, and the bar stays honest
    draw(i, 0);
    const r = await sendVideo(eid, ok[i], loaded => draw(i, loaded));
    done += ok[i].size;
    const res = r.body && r.body.results && r.body.results[0];
    if (res && res.status === "queued") added++;
    else problems.push(`${ok[i].name}: ${res ? res.error : (r.body && r.body.message) || (r.status === 413 ? "too large for the server" : "upload failed")}`);
  }
  VD.busy = false;
  const p = document.getElementById("vprog"); if (p) p.innerHTML = "";
  if (added) toast(`Added ${added} video${added === 1 ? "" : "s"}.`);
  if (problems.length) toast(problems.slice(0, 3).join(" · ") + (problems.length > 3 ? ` (+${problems.length - 3} more)` : ""), true);
  if (EV && EV.id === eid) { await loadVideos(); refreshEvent(); }
}

function bindDrag(kb) {
  let dragId = null;
  const ph = document.createElement("div"); ph.className = "kb-ph";
  const clear = () => { ph.remove(); kb.querySelectorAll(".over").forEach(x => x.classList.remove("over")); };
  kb.querySelectorAll(".kb-card[draggable]").forEach(c => {
    c.ondragstart = e => { dragId = +c.dataset.task; e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", String(dragId)); } catch (x) {}
      setTimeout(() => c.classList.add("dragging")); };
    c.ondragend = () => { c.classList.remove("dragging"); clear(); dragId = null; };
  });
  kb.querySelectorAll("[data-drop]").forEach(z => {
    z.ondragover = e => {
      if (dragId === null) return;
      e.preventDefault(); z.classList.add("over");
      if (!z.classList.contains("kb-body")) return;  // a folded column: the task goes to the end
      const next = [...z.querySelectorAll(".kb-card:not(.dragging)")].find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
      if (next) z.insertBefore(ph, next); else z.appendChild(ph);
    };
    z.ondragleave = e => { if (!z.contains(e.relatedTarget)) { z.classList.remove("over"); ph.remove(); } };
    z.ondrop = async e => {
      e.preventDefault(); if (dragId === null) return;
      const id = dragId, stage = z.dataset.drop;
      let next = ph.parentNode === z ? ph.nextElementSibling : null;
      while (next && +next.dataset.task === id) next = next.nextElementSibling;
      clear();
      // the whole column, not just what the filters show, so hidden tasks keep their place
      const order = columnOf(stage, id), at = next ? order.indexOf(+next.dataset.task) : -1;
      order.splice(at < 0 ? order.length : at, 0, id);
      const t = TK.tasks.find(x => x.id === id), from = t.stage;
      t.stage = stage; order.forEach((x, i) => { TK.tasks.find(y => y.id === x).position = i + 1; });
      paintBoard();  // move it now; the server's answer follows
      try { await api("POST", `/api/tasks/${id}/move`, { stage, order }); if (from !== stage) toast(`Moved to ${stageLabel(stage)}.`); } catch (x) { fail(x); }
      refreshTasks().catch(fail);
    };
  });
}

    ${b ? `<p class="muted small" style="margin:4px 0 0">Added by ${esc(b.created_by || "—")} · last changed ${new Date(b.updated_at * 1000).toLocaleString()}</p>` : ""}
    <div class="row" style="justify-content:space-between;margin-top:14px"><span>${b && edit ? `<button type="button" class="btn danger" id="bk-del">Delete</button>` : ""}</span>
      <span class="row"><button type="button" class="btn" data-close>${edit ? "Cancel" : "Close"}</button>${edit ? `<button class="btn primary">${b ? "Save" : "Add booking"}</button>` : ""}</span></div></form>`,
    { onMount: (ov, close) => {
      const form = ov.querySelector("#bkf");
      const bal = () => { const a = Number(form.amount.value) || 0, p = Number(form.paid.value) || 0, st = !a ? "not_finalised" : p >= a ? "paid" : p ? "part" : "unpaid";
        ov.querySelector("#bk-bal").innerHTML = `<b>${esc(fmtMoney(Math.max(0, a - p)))}</b> <span class="badge ${PAY[st][0]}">${PAY[st][1]}</span>`; };
      form.addEventListener("input", bal); bal();
      ov.querySelector("#bk-client").onchange = e => { const c = CAL.clients.find(x => x.id === +e.target.value); if (!c) return;
        if (!form.client_name.value.trim()) form.client_name.value = c.name; if (!form.phone.value.trim()) form.phone.value = c.phone || ""; };
      form.onsubmit = async e => { e.preventDefault(); if (!edit) return;
        const d = Object.fromEntries(new FormData(form));
        const body = { ...d, client_id: d.client_id ? +d.client_id : null, end_date: d.end_date || null, start_time: d.start_time || null, end_time: d.end_time || null,
          amount: Number(d.amount) || 0, paid: Number(d.paid) || 0 };
        try { await api(b ? "PATCH" : "POST", b ? "/api/calendar/" + b.id : "/api/calendar", body); close(); toast(b ? "Saved." : "Booking added.");
          const m = body.date.slice(0, 7); viewCalendar(m); if (location.hash !== "#/calendar/" + m) history.replaceState(null, "", "#/calendar/" + m); } catch (x) { fail(x); } };
      const del = ov.querySelector("#bk-del"); if (del) del.onclick = async () => { close();
        if (!await confirmBox("Delete this booking?", `${b.title} on ${fmtDay(b.date)}. This can't be undone.`, "Delete", true)) return;
        try { await api("DELETE", "/api/calendar/" + b.id); toast("Deleted."); viewCalendar(CAL.ym); } catch (x) { fail(x); } };
    } });
}

/* ------------------------------------------------------------------ routing */
function wire() {
  $app.querySelectorAll("[data-href]").forEach(r => r.onclick = () => location.hash = r.dataset.href);
  $app.querySelectorAll('[data-act="new-client"]').forEach(b => b.onclick = clientModal);
  $app.querySelectorAll('[data-act="new-event"]').forEach(b => b.onclick = () => eventModal(b.dataset.client).catch(fail));
}
let LAST_HASH = location.hash;
window.addEventListener("beforeunload", e => { if (EST_DIRTY) { e.preventDefault(); e.returnValue = ""; } });
async function route() {
  if (EST_DIRTY) {  // leaving an estimate or invoice with unsaved changes: stay put and ask in the app's own dialog
    const target = location.hash;
    history.replaceState(null, "", LAST_HASH);
    const go = await leaveDialog();
    if (go) { EST_DIRTY = false; location.hash = target; }
    return;
  }
  LAST_HASH = location.hash;
  const h = (location.hash || "#/").slice(1), [path, query] = h.split("?"), parts = path.split("/").filter(Boolean);
  const gerr = new URLSearchParams(query || "").get("google");
  if (parts[0] === "join") {  // the token stays in this tab only, out of the address bar and history
    const t = new URLSearchParams(query || "").get("token");
    if (t) { JOIN_TOKEN = t; try { sessionStorage.setItem("pf_join", t); } catch (e) {} history.replaceState(null, "", "#/join"); }
    return viewJoin();
  }
  if (parts[0] === "reset") {  // keep the token in memory and out of the address bar and history
    const t = new URLSearchParams(query || "").get("token"); if (t) { RESET_TOKEN = t; history.replaceState(null, "", "#/reset"); }
    return viewReset();
  }
  if (parts[0] === "forgot" && !ME) return viewForgot();
  if (gerr) { NOTICE = GOOGLE_ERRORS[gerr] || GOOGLE_ERRORS.error; if (parts[0] !== "join") history.replaceState(null, "", "#/login"); }
  try {
    if (!ME) { try { ME = await api("GET", "/api/auth/me"); } catch (e) { ME = null; } }
    if (!ME && parts[0] === "google-finish") return await viewGoogleFinish();
    if (!ME) return viewLogin(parts[0] === "signup" ? "signup" : "login");
    applyBrand(ME.account.brand_color);
    if (!ME.account.timezone && browserTz() && can("company")) {  // accounts made before time zones existed: adopt this browser's
      try { ME = await api("PATCH", "/api/account", { timezone: browserTz() }); } catch (e) {}
    }
    if (!parts.length) return await viewHome();
    if (["login", "signup", "google-finish"].includes(parts[0])) { location.hash = "#/"; return; }
    if (parts[0] === "clients") return parts[1] ? await viewClient(parts[1]) : await viewClients();
    if (parts[0] === "events") return parts[1] ? await viewEvent(parts[1]) : await viewEvents();
    if (parts[0] === "settings") return await viewSettings();
    if (parts[0] === "team") return parts[1] === "inventory" ? await viewInventory() : await viewTeam();
    if (parts[0] === "calendar") return await viewCalendar(parts[1]);
    if (parts[0] === "tasks") return await viewTasks();
    if (parts[0] === "billing" || parts[0] === "estimates") return parts[1] ? await viewEstimate(parts[1], query) : await viewEstimates();
    location.hash = "#/";
  } catch (e) {
    if (e.code === "not_found") { toast(e.message, true); location.hash = "#/"; } else fail(e);
  }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
